er and I couldn't put it down until I turned the last page, other than to send teasers to my Facebook page. I loved the characters. Their story was an emotional roller coaster ride for me. Everyone sees Nora as the perfect, innocent, rich girl, but she has scars and things she hides from the world. When Leo meets Nora they have an instant connection. Their story makes the reader believe in soul mates and destiny. A beautiful love story with hot and steamy romance. Loved it and can not wait to find out who will star in the next Briarcrest Academy book. *Review copy provided by the author in exchange for an honest review. [...] [...] [...] [...] Twitter: @readingpajamas", "stars": 1, "hv": 1, "tv": 1, "ver": 0, "vine": 0, "label": "positive", "date": "2013-09-09"}, {"id": "R323XTLCRHSVNV", "cat": "eBooks", "pid": "B00814M37U", "title": "The Theory of Attraction (The Science of Temptation Book 1)", "head": "A sit-up-and-take-notice approach to the genre", "body": "*Previously posted on Goodreads* Refreshing approach to a romance, and smart, witty, and humourous to boot. I can totally identify with H's frustration with people in general, and at the same time, I totally live the h's whole being-with-the-nerd thing! Kudos to Ms. Dryden. Enjoyed this one immensely!", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2013-09-09"}, {"id": "R2GCYZ2FE0V4L0", "cat": "eBooks", "pid": "B00AYLMLM0", "title": "The Stuck with a Series Boxed Set #1 (The Stuck with a Series Boxed Sets)", "head": "Pretty Much a Hot Mess", "body": "The prequel shows promise and led me into the first book which started off well. At least until the chapter when the body is discovered. Then the author seemed to loose focus. Sam's character suddenly reveled she has mob connections and we are introduced to a group of people called the Mom Squad. They somehow play a role in solving the mystery You are also introduced to Nick's crazy aunt which sets up the second book. In the second book the crazy aunt has a voodoo curse go wrong and everybody including the Sherriff is running around trying to undo the curse with more magic. Which by the way the author insists on misspelling. Some part of the story are humorous but it would have benefited from a good editor. Sam's character expresses interest in learning magic (my spelling not theirs) in this book. Now we hit the third book in which we again find Sam's Mom squad and now we find out that Sam is related to Santa Claus and the Grams character is dating father time. We also see the return of Magic in the form of the queen of the witches. So if Sam wanted to learn more about magic why didn't she just go to this witch she already knows? The authors seem to be addicted the unbelievable plot twist school of writing. They also like to change voices pretty much every chapter from Nick to Sam unless they don't. Kind of like the book I couldn't really find a pattern. They started out with a good premise and then seemed to say \"Oh well lets write this half stoned\". Truthfully I would have given it two stars but, knowing what is involved in writing a book and given the fact it did hold my attention if only to find out what whacked out thing they would introduce next I gave it three. If you are looking for a good mystery this isn't it. If you are looking for a book that will keep you guessing if only as to what or who they will introduce next this would be a good choice. I just wished that after they introduce these new characters they would do a better job of developing them.oduce these new characters they would do a better job of developing them.", "stars": 0, "hv": 1, "tv": 2, "ver": 1, "vine": 0, "label": "negative", "date": "2013-09-09"}, {"id": "R2WZYCLA0G68KY", "cat": "eBooks", "pid": "B00AR5RYP2", "title": "Asshole: How I Got Rich & Happy By Not Giving a Damn About Anyone & How You Can, Too", "head": "Cover to cover", "body": "I read this book in an entire sitting! It truly does live up to its name and Martin Kihn did a great job in ensuring that.", "stars": 1, "hv": 0, "tv": 0, "ver": 0, "vine": 0, "label": "positive", "date": "2013-09-09"}, {"id": "RQA3ZVXTNQLCY", "cat": "eBooks", "pid": "B00CD3Y1NE", "title": "The 7 Best Beginning Tropical Fish Species For Starting A New Aquarium", "head": "Good guide book", "body": "This book is just what it says it is. If you are putting together a new aquarium, he takes you through the process of selecting your first round of fish. Talks about which ones can handle the process of the tank becoming a balanced eco system. This isn't a simple process and some fish can't handle it. He also discusses different fish and which ones work best in different sized tanks. I recommend this for anyone starting out with a new aquarium.", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2013-09-09"}, {"id": "RB0KM59GHX4F4", "cat": "eBooks", "pid": "B0046A9V7I", "title": "SECRETS FROM THE DUST", "head": "good book", "body": "Enjoyed the book and a little covered aspect of Austrailian history. Just felt the end was too abrupt and left the heroine hanging in limbo. Or was that meant to be?", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2013-09-09"}, {"id": "R40YZE48O0629", "cat": "eBooks", "pid": "B0050DZDRW", "title": "The St. Paul Conspiracy: A compelling crime thriller (Mac McRyan Mystery Series Book)", "head": "Easy reading", "body": "this was the first one I read of this series, it's a great little mystery/action novel. I am just getting into the series and have read through them very quickly,", "stars": 1, "hv": 1, "tv": 1, "ver": 1, "vine": 0, "label": "positive", "date": "2013-09-09"}, {"id": "R3NQAASE2HKVSQ", "cat": "eBooks", "pid": "B00873GVSC", "title": "Movement System Impairment Syndromes of the Extremities, Cervical and Thoracic Spines - E-Book", "head": "Must have for clinicians", "body": "Should be part of every therapist's personal library. Very informative, I wish I would have purchased when it was first published.", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2013-09-09"}, {"id": "RQGJTZDX3HPPS", "cat": "eBooks", "pid": "B004PVSOXA", "title": "Venture Capital 101", "head": "Good intro to Venture Capital", "body": "Having consulted for Private Equity, I had a fair understanding of the Venture Cap market. Still Bill Snow was able to add insight and understanding through this easy to ready introduction to VC. It's not as detailed as similar books, but it's fictional examples helps the read better understand concepts that might otherwise be hard to grasp.", "stars": 1, "hv": 1, "tv": 1, "ver": 1, "vine": 0, "label": "positive", "date": "2013-09-09"}, {"id": "R35IOFXKEL3GVN", "cat": "eBooks", "pid": "B007MB5XLQ", "title": "Serpent's Kiss: A Witches of East End Novel (Witches of the East Book 2)", "head": "Loved it", "body": "Absolutely loved this book can't wait to read the third=) probably the best series I've read from this author so far=)", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2013-09-09"}, {"id": "R27RDYF18IMW0I", "cat": "eBooks", "pid": "B007PJMH82", "title": "From Rogue to Vogue: Why Did Libya Give Up Its Weapons of Mass Destruction?", "head": "Not the right book!", "body": "Although the Cover says its \\\\\"From Rogue to Vogue: Why Did Libya Give Up Its Weapons of Mass Destruction?\\\\\" the text is about Marine weapons training. I am seeking a refund!", "stars": 0, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "negative", "date": "2013-09-09"}, {"id": "R3H0C5JRYJ4RDS", "cat": "eBooks", "pid": "B0053YT19O", "title": "A Midsummer Night's Dream In Plain and Simple English (A Modern Translation and the Original Version)(Translated) (Classics Retold Book 3)", "head": "A Midsummer Night's Dream", "body": "Every teacher of Literature should use this book. It completely demystifies Shakespeare. The students love it! And it makes the play even more funny. Students can get success on their assignments. It is a must.", "stars": 1, "hv": 0, "tv": 1, "ver": 1, "vine": 0, "label": "positive", "date": "2013-09-09"}, {"id": "RYLNHZJHO0VEH", "cat": "eBooks", "pid": "B00AF9B2QC", "title": "Making Over Maggie (Women of Surprise Book 3)", "head": "good reading", "body": "It held my interest and difficult to put it down until it was finished . Looking forward to more like it.", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2013-09-09"}, {"id": "RD2PF7BDKP41T", "cat": "eBooks", "pid": "B00DW47I8I", "title": "Junk (The Bristol Collection Book 1)", "head": "5 stars for this story", "body": "what can I say....another great story from Ms Myles. Working with hoarders is one my interest area and found working with these individuals truly rewarding. …so I have been waiting to read this book for some time and ordered it in advance….what a treat it was to find it in my kindle last weekend….*grin* I also believe that there is a bit of hoarder in most of us (you should see my sewing room!) so reading the journey of Jasper and Lewis was certainly captivating for me. Jasper’s story brought tears to my eyes at times and certainly filled me with empathy. Lewis’ ethical dilemma about his counter-transference experience was also very interesting and how he dealt with his struggle and guilt. But I also felt it was more than average counter-transference expereince as Lewis had a powerful crush on Lewis from his high school days. I really liked the way Josephine tactfully created Lewis’ profession so noone would be too caught up that a therapist was emotionally & sexually involved with a patient….well… Lewis was still Jasper’s therapist albeit an unregistered one but at least they took 6 month away from each other and then Lewis decided to study further (which would help him to understand more about the dynamics in a therapeutic relationship)…so I felt better as a professional… I also liked the way Josephine added a little sexual intimacy without overwhelming Jasper and Lewis’ emotional journey… Lewis’s parents were simple adorable!!! They reminded of the previous owner of my home so I kept laughing whenever I visualised them walking around naked doing chores…bending around to pick up things…putting the baking tray into the oven…sitting around…hahahhaaaaa There were no perfect bodies with stunning features in this book , how refreshing is that! Jasper and Lewis were just everyday individuals dealing with life and desperately trying to resolve their personal issues. I think, Josephine wrote this story with a wonderful level of sensitiveness and empathy. Here is another writer pointing out that love is not just for the successful, and the beautiful but is for everyone no matter what….I love this concept in a book….whether one is living with an illness, or a disability, or in poverty with emotional, physical scars, there is still another out there who will think the world of that “one”…sephine wrote this story with a wonderful level of sensitiveness and empathy. Here is another writer pointing out that love is not just for the successful, and the beautiful but is for everyone no matter what….I love this concept in a book….whether one is living with an illness, or a disability, or in poverty with emotional, physical scars, there is still another out there who will think the world of that “one”…", "stars": 1, "hv": 1, "tv": 1, "ver": 1, "vine": 0, "label": "positive", "date": "2013-09-09"}, {"id": "R226K56YWSF6VH", "cat": "eBooks", "pid": "B00D5XZELE", "title": "Dale Color A Tu Vida (Spanish Edition)", "head": "Excelente libro", "body": "Este libro de una forma fresca y agradable plantea como Dios puede cambiar tus circunstancias, cambia el color de tu vida, pintala de los colores mas hermosos", "stars": 1, "hv": 1, "tv": 1, "ver": 1, "vine": 0, "label": "positive", "date": "2013-09-09"}, {"id": "RFX5Y4ZHPG81I", "cat": "eBooks", "pid": "B008BM4LZY", "title": "Lover At Last (Black Dagger Brotherhood, Book 11)", "head": "Love Knows No Gender", "body": "Absolutely loved Quinn and Blay's story! A great addition to the BDB series! It was the first m/m romance I've read but it works because you have cared about these characters for so long you want to see it work out for them. Love knows no gender.", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2013-09-09"}, {"id": "R3ASS0L4DQW820", "cat": "eBooks", "pid": "B00779MUPK", "title": "Time Untime (Dark-Hunter Novels Book 16)", "head": "Well done", "body": "I love the characters that in the books. I always love the special drop by from Ash and even Nick now.", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2013-09-09"}, {"id": "R1RE63E1U3XZ1T", "cat": "eBooks", "pid": "B004C05694", "title": "Velvet Ball and The Broken Fairy (Velvet and Roseberry Book 1)", "head": "Not my cup of tea", "body": "Hi, I was unable to complete this book. Didn't work for me. I am very interested in learning more about what people deal with but this isn't the way I can learn about this illness.", "stars": 0, "hv": 1, "tv": 8, "ver": 1, "vine": 0, "label": "negative", "date": "2013-09-09"}, {"id": "RQDS718CE7IDY", "cat": "eBooks", "pid": "B00CR4IKFY", "title": "Dead Last", "head": "Best book i've read in a while!", "body": "This is one of the best book I have read for some time. The amazing story pulls you in deeper and really connects you emotionally with the characters. You begin to feel what they are going through and that only makes the book better! I love good fictional Sci-fi novels and this one ranks high up on my list. I would highly recommend this book to anyone who wants a good scare and good story!", "stars": 1, "hv": 3, "tv": 4, "ver": 0, "vine": 0, "label": "positive", "date": "2013-09-09"}, {"id": "R25FM7PDA2T9MO", "cat": "eBooks", "pid": "B006LSZECO", "title": "Gone Girl: A Novel", "head": "book", "body": "I did not get this item. I ended up ordering it through my ipad. So i can't rate this seller.", "stars": 1, "hv": 0, "tv": 2, "ver": 1, "vine": 0, "label": "positive", "date": "2013-09-09"}, {"id": "R1PUJWRQJCZ89G", "cat": "eBooks", "pid": "B00DNMRWDK", "title": "Ravenous (novella) (Novella)", "head": "A novella to read!", "body": "I dub Eden Summers the Queen of novellas. It's not easy to fit so much story, background, personality, passion and love in so few pages. Not only does Ms. Summers accomplish this, but she does so in spectacular fashion. Erin McDonald is getting through each day by putting on a happy face and acting as if she is suffering from a broken heart. For the love of god, 8 years has gone by. Is it going to stop hurting when she thinks of Jesse and how he left her behind? Probably not, especially now that he's back in town for a visit. Her body and heart seems to have forgotten that he's bad news and leads to nothing, but pain. Jesse Hackett has never regretted his decision to leave behind the country life for a successful career in the city. But, he's always been haunted by the loss of the love of his life. He's back in town for his mom's birthday and he wants nothing more than to rekindle the old flame. How to do that without breaking both of their hearts even more is the big question. He is only visiting and will be going back to his life in the city and he knows Erin would never follow him. This book is not short on heat and passion, that's for sure. The witty banter between Erin and her sister made me laugh out loud in more than one spot. Eden really is very good at sarcastic humor, which just happens to be my first language. The love between Jesse and Erin was bittersweet, yet fun to read. I highly recommend this book and any other Eden Summers story. You won't be sorry! Thank you so much NetGalley.com for the loan of this book in exchange for my honest review. You can find this review and others at [...] and [...]", "stars": 1, "hv": 0, "tv": 0, "ver": 0, "vine": 0, "label": "positive", "date": "2013-09-09"}, {"id": "R22E9CCA6CT6H7", "cat": "eBooks", "pid": "B00CQYVAV6", "title": "Ballet Auditions (An Aspiring Ballerina's Guide To... Book 2)", "head": "Excellent knowledge for the dad of an aspiring ballerina...", "body": "I bought the other books in the \\\\\"Aspiring Ballerina's Guide\\\\\" series, and although my daughter won't be auditioning anytime in the near future, I figured I'd buy this one too, seeing as it's so cheap and she enjoyed the others so much. Obviously, I can't attest as to exactly how effective the advice in the book is, but I've skimmed it and the information seems thorough and pertinent. Seems like it would be relevant for all dancers, not just ballet.", "stars": 1, "hv": 1, "tv": 1, "ver": 1, "vine": 0, "label": "positive", "date": "2013-09-09"}, {"id": "R8MVOCO8OOJIX", "cat": "eBooks", "pid": "B00CD79U0E", "title": "The Paleo Diet For Beginners Slow Cooker Recipe Book: Gluten Free, Everyday Essential Slow Cooker Paleo Recipes For Beginners or How To Get Started With A Paleolithic Diet", "head": "It is what I was looking for.", "body": "Exactly what I was looking for as I try to eat as little carbs as I can due to my diabetes.", "stars": 1, "hv": 1, "tv": 1, "ver": 1, "vine": 0, "label": "positive", "date": "2013-09-09"}, {"id": "R1D3Q4NUVHZMTB", "cat": "eBooks", "pid": "B00EVB9HEY", "title": "Forbidden Fruit (New Adult May December Romance)", "head": "Hot Reading!", "body": "\"If you want a really Hot book, that makes you want to take a cold shower for your temperature descend, this is the book! Selena obviously knows how to write sex scenes! OMG, they are really out of the charts! This a story of two friends who together discover sex and explore it in all ways they can. They are both twenty, and have a catholic education. Leah lives with her mother, and his father leave them a long time ago. Erika lives with his widower father, Rob. He is handsome and Leah who spend a lot of time in Erika's house , starts to have love and sexual feelings for him. Well, all become complicated because he is much older and because her type of relationship with Erica. For me the problem isn't about the taboo of dating your best friend's dad, beyond the problem of his age, I think he has feel in a relationship with Leah too fast, without any resistance. He takes her virginity without second toughts, and he has a daughter with the same age.Maybe things could be more slowly until they go for the real deal. And I think Leah cold stop all the things with Erika sooner. I want to know if they are really stay together, because he didn't think in marriage,but he wants she lives with him.... I expect more of Rob. Great sexy reading!\"", "stars": 1, "hv": 0, "tv": 2, "ver": 0, "vine": 0, "label": "positive", "date": "2013-09-09"}, {"id": "R2FQ3YOG79NZ78", "cat": "eBooks", "pid": "B00DMAPFEQ", "title": "The Nature of Cruelty", "head": "WOW Loved It !!", "body": "What a wonderful surprise !...I loved this book... could not put it down ,the characters are well developed and the story is different and wonderfully written !! LOVED ,LOVED,LOVED IT !!!", "stars": 1, "hv": 2, "tv": 2, "ver": 1, "vine": 0, "label": "positive", "date": "2013-09-09"}, {"id": "RLVX3GUO7DF10", "cat": "eBooks", "pid": "B00CKXCNH8", "title": "Pilgrim's Inn (The Eliots of Damerosehay series Book 2)", "head": "Fell in love with the family.", "body": "I like books that take you up and put down in the middle of the family making you feel you are living in their time and place. I was not reading their story I was living in the middle of their lives.", "stars": 1, "hv": 12, "tv": 12, "ver": 1, "vine": 0, "label": "positive", "date": "2013-09-09"}, {"id": "RWHET8LB6L51G", "cat": "eBooks", "pid": "B001DR7K02", "title": "An Exact Replica of a Figment of My Imagination: A Memoir", "head": "heartbreaking and so true", "body": "I read this six weeks after losing my unborn son. I read it in about 12 hours. It was true. It broke my heart. I cried for Pudding and of course for my son, Jamie. A year ago I couldn't have read this book. It would have been too scary and painful to read of a loss that spoke to my worst nightmare. Now I cling to these accounts like life rafts. Somehow people find a way through this. That is good to know.", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2013-09-09"}, {"id": "R294TOABSJRM93", "cat": "eBooks", "pid": "B004UJLDEY", "title": "The True Benjamin Franklin", "head": "For a truer walk through history...", "body": "...read about the Founders through their own words! I came to realize that what I was reading in history books, was the point of view of the author. In order to get a clear picture of what the Founders were really thinking, you must do your own homework. Read different points of view with an open mind and find authors who provide context for the quotes that doesn't skip straight to modern opinion. This book fits that effort.", "stars": 1, "hv": 1, "tv": 1, "ver": 1, "vine": 0, "label": "positive", "date": "2013-09-09"}, {"id": "R3N4ZK4A1M1MBG", "cat": "eBooks", "pid": "B00DWH8Q8G", "title": "Change The World: And Make Big Money Teaching, Training, And Serving Humanity", "head": "Good book!", "body": "Christian has a fresh and authentic view point on coaching and internet marketing. I really enjoyed reading it. It was very informative and inspiring. L. Andrew Morgan The Goals Coach [...]", "stars": 1, "hv": 0, "tv": 0, "ver": 0, "vine": 0, "label": "positive", "date": "2013-09-09"}, {"id": "RO0KB42BXDCS1", "cat": "eBooks", "pid": "B00ECZGMG0", "title": "Devil's Paw (Imp Series Book 4)", "head": "Another Great Read", "body": "Another great read, couldn't put it down. It will be interesting to see how all this impacts Sam in the next one.", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2013-09-09"}, {"id": "R1NIUE52JQ7VF1", "cat": "eBooks", "pid": "B008SAZHLQ", "title": "Eleanor & Park", "head": "Poetry", "body": "I Read it in one night. Couldn't put it down! It was beautiful and tragic. I miss the characters already.", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2013-09-09"}, {"id": "RS6P5RC36A15U", "cat": "eBooks", "pid": "B0011UJLL2", "title": "Acheron: A Dark-Hunter Novel (Dark-Hunter Novels Book 11)", "head": "Must Read", "body": "For anyone who started reading Sherrilyn Kenyon's Dark Hunter series, this was a very high point. I have read all in order and absolutely loved this book. Awesome, Spectacular, Breathtaking! You feel sadness, joy, amazement, and so many more emotions you are almost not sure what to do with them. You cry, you laugh. Any author who can make you feel all of these things is one you want to follow. All books leading up to Acheron are fantastic, but you found yourself wanting to know his personal story so bad and it sure wasn't what you thought it would be. Very well done. Anyone who has read Christine Feehan's Carpaithian Series will want to read Sherrilyn Kenyon's Dark Hunter series. Kudos to the author, you never disappoint.", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2013-09-09"}, {"id": "R2NSWZKICR4RJ5", "cat": "eBooks", "pid": "B005UG1HHO", "title": "Bible Stories", "head": "I don`t like it", "body": "It is a very vague book it tells the basics I'll admit but there are A LOT of stories from the Bible missing from this book. It doesn't tell you much I thought it would be all of the stories but this is just a disappointment.", "stars": 0, "hv": 0, "tv": 0, "ver": 0, "vine": 0, "label": "negative", "date": "2013-09-09"}, {"id": "R3BA2YPDCLFLTF", "cat": "eBooks", "pid": "B00ELNAAKC", "title": "The Divine Secrets of The Whoopie Pie Sisters - Book One - An Amish Christian Trilogy", "head": "The Divine Secrets of the Whoopie Pie Sisters", "body": "I know most of us don't like short books or cliff hangers but because my life is busy short books are great for me. I look forward to the next couple of books from these two lovely ladies. Love reading about the different sisters and how their lives are unfolding for us.", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2013-09-09"}, {"id": "R16YJIE3GF2124", "cat": "eBooks", "pid": "B00E8QN4DM", "title": "The Long Road - A Post Apocalyptic Novel (The New World Book 2)", "head": "Good reading.", "body": "Enjoyed this book. Fast reading. Can not wait for next book. Gives you a lot to think about. How would you handle something like this?", "stars": 1, "hv": 1, "tv": 1, "ver": 0, "vine": 0, "label": "positive", "date": "2013-09-09"}, {"id": "R3M4WVTY2Z55P2", "cat": "eBooks", "pid": "B00A25FAYO", "title": "Shirley Jones: A Memoir", "head": "A Big Disappointment", "body": "I was disappointed in this book, almost from the first page. Shirley Jones was an actress that I admired from afar, until I read about her choices in life. To begin, the book isn't well-written. Jones frequently repeats herself, her sentence structure lacks clarity, and her use of personal pronouns is at times confusing. I could, however, forgive these distractions; after all, she's an actress and singer, not a writer. But she should have made use of a good editor or ghost writer. That said, what I found most unappealing were her vivid descriptions of her sexual mores and lascivious forays with Jack Cassidy, including a 3-way event. Not only does she make clear that Mister Cassidy was \\\\\"very well-endowed,\\\\\" but she also tells us that his son was even bigger. Cassidy, as everyone knew, was an unrelenting cheat and adulterer. But this didn't seem to bother Jones much. At least, not enough to stop loving him or to leave him for many years. The Jones-Cassidy family were dysfunction because, it seems, that neither Jones nor Cassidy did what caring parents are supposed to do. Near the end of the book, Jones repeatedly attempts to justify her marriage to Marty Ingels-as she has been doing for more than 30 years. Jones claims she loved Cassidy (and still does), and that she loves Ingels. Both men, as she describes them, have serious flaws that she excuses and forgives out of hand. Unfortunately, she isn't a very sophisticated women, coming from a small town in Pennsylvania. I know that \\\\\"Tell All\\\\\" autobiographies sell books, but I think Jones discredits herself in this missive. An example of this is, at the end of the book, she proudly boasts (in some detail) of still masturbating regularly at 80 years of age. As Miss Jones warns the reader early in her book, she is not the quaint, innocent young lady she flawlessly portrayed in her early films. And that's just too bad!", "stars": 0, "hv": 8, "tv": 11, "ver": 1, "vine": 0, "label": "negative", "date": "2013-09-09"}, {"id": "R2RNFL87GMAPQV", "cat": "eBooks", "pid": "B008CH20O2", "title": "Destiny's Embrace", "head": "Another Great One!!!", "body": "Thanks so much Ms. Jenkins for all of your African American Historical Romances! I have read them all to date - some of them twice! I love the attention to authenticity and details. I always come away feeling that I not only learned so much about your characters but also about life for African Americans during those times. We, African Americans, have such a rich and embedded history in America and I love to read your novels as you showcase this.", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2013-09-09"}, {"id": "R2QX5EGKML9U3O", "cat": "eBooks", "pid": "B004CFA9RS", "title": "Divergent (Divergent Trilogy, Book 1)", "head": "Awesome", "body": "I couldn't put it down. It was a great book I will read this series again and again. I really like the characters", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2013-09-09"}, {"id": "R21LRZKJADN3H6", "cat": "eBooks", "pid": "B00B85M0FO", "title": "Undeniably Yours (A Porter Family Novel Book #1)", "head": "Good book", "body": "ENJOYED this good clean read! Will look for more from this author. Bethany house publishers thanks for good clean books!", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2013-09-09"}, {"id": "R23FKBEXURC3SN", "cat": "eBooks", "pid": "B00F225YK2", "title": "Very Bad Things ( Briarwood Academy Book 1)", "head": "Holy Hotness, Blasphemy, & Desires Ilsa!", "body": "Another Fave of 2013 <3 <3 I've been totally drawn to this story since the day I watched the trailer, and the freaking gorgeous cover also had me gaga for this book. So, once I finally had it at my wee little fingertips, I DEVOURED it. I could not stop reading, I needed to satiate my hunger for all things Nora Blakely....and Leo Tate too! Nora, Nora, Nora!!! Girl you've gone and rocked my world. I've never hoped for a character to come out on top, as I did Nora. She's the epitome of perfection, beauty, and brains. She has the world at her fingertips and little does she know it, men within arms reach. She may have been fed by the silver spoon, but it wasn't always skittles rainbows and fluffy unicorns. Nope! Life has been anything but wonderful for Nora. Basically she was thrown to the wolves....and by wolves I mean her wonderful family. They are wolves in sheep's clothing. Other than the wolves, I was completely intrigued with Nora's approach on life. She is ready to let go of the good girl persona, and step into the world of carelessness, fun, partying, and God knows what else. She may walk on the wild side, but sometimes life throws you a gazillion curve balls when you least expect it to....enter Leo Tate, Baby! Dear goodness, Leo had me wrapped around his pinky finger the moment he waltzed into my life. Not only does he have stunningly good looks, he has bad boy written all over him. So yeh he's super sexy!! And he also shines bright like a diamond, in my eyes. He is a bad boy in every which way, but holy hell he is also one of the kindest men on the planet. Oh did I mention he is also a freaking delicious Rocker Man?!?!?!?! Yeh, he is. He literally will boogie woogie his way into your heart. As much as he is kind and beautiful, he is totally off limits to any woman under the age 25....but little does he know, his world is gonna tilt on its axis when Nora Blakely, not so graciously, enters his life. I need more Sebastian's and Mila's in my life. These two are the very bestest friends ever ever ever!!! I loved them to pieces. They are the type of friends that would bend over backwards to fulfill any request to make Nora happy. They love her completely. They're her rock when she needs them, and they help keep her sane and somewhat smart when decision making. Seriously, Mila and Seb complete me. They helped Nora spread her wings, so she could to learn to fly! Wanna talk angst? Well ok. I didn't know what to expect in the angst dept., but damn it was off the charts. I kept waiting for it to stop. But it didn't, not once. The angst first begins the second Nora and Leo meet, and then it snowballs from there. Their sexual chemistry is angsty too.....hot damn!!! I could talk for days about the desires and want that was flaming, but it would get boring....so you just need to know it had me at hello! I loved every second of their angst/chemistry factor! Sooooo...I went into this book thinking things were going to be hunky-dory and all will be right in the world. Well I was in for a surprise. All my first thoughts about this book, flew out the window. They were then replaced with WTH?!?! moments, and swoony ones too! For this being a debut book by Author Ilsa Madden-Mills, she hit the ball out of the park! She wrote a story full of hope, dreams, love, heartache, and chances. If you're looking for a book to eat up, then this is the one for you. I could not put this book down. I am head over heels in love with it. And I am so eager to continue reading this series. Author Ilsa Madden-Mills turns heartache into extreme contentment and ha lovely little one click finger and purchase your copy of Very Bad Things, Right.This.Minute. Once you've done that, hold onto your panties....You're in for one helluva ride peeps!!!", "stars": 1, "hv": 28, "tv": 36, "ver": 0, "vine": 0, "label": "positive", "date": "2013-09-09"}, {"id": "R256XAX39XRR6T", "cat": "eBooks", "pid": "B004O4C074", "title": "Green Lake", "head": "Green Lake", "body": "Green Lake was a well written thriller. I enjoyed the story very much, though I would have like to know more of. What happened to the sisters life", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2013-09-09"}, {"id": "R29IC9G3CTMS3F", "cat": "eBooks", "pid": "B007J4T2G8", "title": "Fifty Shades of Grey (Fifty Shades, Book 1)", "head": "I didn't care for the subjugation of women....", "body": "I realize there are also a lot of men who want to be made into submissives out there, but why are we so fascinated with women being demeaned, controlled, and subjugated in our society? I also thought the book was totally unrealistic - sort of a modern-day 'mild porno' romance novel....I only read the first book and wasn't interested in reading the other two...", "stars": 0, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "negative", "date": "2013-09-09"}, {"id": "R2QL8PJZG230RI", "cat": "eBooks", "pid": "B007MAXDN2", "title": "The Witch Doctor's Wife with Bonus Material (Promo e-Books)", "head": "Good and interesting.", "body": "An interesting book. I have worked in Angola so I could relate to a lot of the book, just more modern times. The last couple of sentences had me questioning something that was previously written. But, the ending was good otherwise.", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2013-09-09"}, {"id": "R1CDM8YFKS6MOM", "cat": "eBooks", "pid": "B005VB5BIO", "title": "Dead Sky Morning (Experiment in Terror #3)", "head": "Excellent", "body": "I love this series, I cant wait for the next book. I just noticed that there are books that say book 6.5 ... I love the whole series, I am looking forward to all of them!!", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2013-09-09"}, {"id": "R75PP4PWGPM85", "cat": "eBooks", "pid": "B005H4V4UO", "title": "Masters at Arms (Introduction to the Rescue Me Saga)", "head": "Great introduction. Can't wait to read the series!", "body": "I had a hard time figuring out how to write this review. I loved this book, but if you're looking to this book because it's a BDSM series, you'll be a little disappointed. Maybe. Well, I hope not. But let me explain. The author starts out the book telling you exactly what you're going to get. Backstory. You get the backstory for the main characters in a multi-book BDSM series (the Rescue Me series). There's not much sex in this book at all. A couple of steamy scenes that are tame from a BDSM point of view and one scene that is graphic that shows one of the characters forced into sexual slavery (so it's not at all sexy). That said, this book is fantastically written. The characters are amazing. I loved them all. The depth they show, the real, authentic feelings, and their actions all drew me in. I will be reading every book in this series because I am so invested in these characters now. So buy this book. Read it. Get to know Adam, Damien, and Marc. (Also Kayla and Savi.) And then buy the rest of the books in the series.", "stars": 1, "hv": 2, "tv": 3, "ver": 1, "vine": 0, "label": "positive", "date": "2013-09-09"}, {"id": "RKCQ6GN020NR1", "cat": "eBooks", "pid": "B00EBRKWEC", "title": "Winning the Boss's Heart (Entangled Indulgence)", "head": "A Winning Proposition", "body": "A temporary arrangement that blazes with heat from the very beginning. Mason is looking to refurbish this estate and move on. He needs an assistant for only 12 weeks so the job can be finished in time. Billie is looking for a temporary arrangement where she can make money to go to college. This job opportunity sounds almost perfect... until you factor in the chemistry they both feel. This story was heartwarming, sensual, and extremely sensitive to the topic of losing a child. Mason is the broken man - broken by the loss of his daughter and the dissolution of his first marriage. All he is interested in is working, keeping his mind busy so he does not have to think about his feelings, and being able to sleep at night. Although he keeps busy, his thoughts still plague him and sleep eludes him. Billie's influence on Mason is obvious from the very beginning of their strange arrangement. She is so full of love and empathy, she could rally anyone to happiness. I love how she handles Mason and brings him around kicking an screaming, so to speak, so he can face life, his feelings and finally become a worthy member of society. This book is a fantastic one day read full of entertainment. Tastefully sensual, this romantic story will leave you smiling.", "stars": 1, "hv": 1, "tv": 1, "ver": 0, "vine": 0, "label": "positive", "date": "2013-09-09"}, {"id": "R1F81UPF4GAL95", "cat": "eBooks", "pid": "B00ES1IWVQ", "title": "Anywhere", "head": "Fall In Love With Anywhere", "body": "I received this book in exchange for an honest review. This book drew me in and kept me up Friday night. I read until I realized all of my kids had put themselves to bed. I tore through 51 percent of it that night. If Saturday and Sunday weren't so busy I would have finished it Saturday at least by lunch! But by 3pm Sunday I was finished. I love Skye, she's vulnerable and she may not know what she wants, but she does know what she doesn't want. She's a grownup who has never been on their own, not really. I like the detailed best friendship she has with Paige as well as her relationship with her younger brother. I also like the depth of Asher's character. I absolutely loved the plot and the journey. Skye is a girl we all have inside. She's taking the 'what if's' out of the equation. Figuring out who she is and what she really wants. It is the bravest thing that a person can do. All I can say after reading it really is BRAVO!! j. meyers officially made me want to give a book a standing ovation! My brain echoed with the John Hughes-ish clapping to thundering applause. If you want to laugh and cry and laugh some more and swoon..... Anyways! Just a really really good read! NA & Romance fans THIS IS THE BOOK FOR YOU!!! Get the book and fall in love!! Anywhere! ((Fade Into You by Mazzy Star played in my headset as I read the last chapter and yeah... That was awesome...))", "stars": 1, "hv": 0, "tv": 0, "ver": 0, "vine": 0, "label": "positive", "date": "2013-09-09"}, {"id": "R1GXAN2DR5E231", "cat": "eBooks", "pid": "B002MBLU9U", "title": "Hatchet (Brian's Saga Book 1)", "head": "GREAT", "body": "Love this. We have read many times. Great story. Thanks for a great product!!!!!! Definetly would recommend to any one.", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2013-09-09"}, {"id": "R2F3BWWK5805C9", "cat": "eBooks", "pid": "B00DPAN1BC", "title": "Her Favorite Temptation (Mathews Sisters Book 1)", "head": "Free ebook", "body": "I got this ebook for free, and it was decent, but a little flat. The world she created was very small and static. I did, however, want to find out what happened to the characters, even though in a romance novel, there's a guarantee that the couple would end up together. Hence, I give it 4 stars.", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2013-09-09"}, {"id": "R26MV8D0KG6QI6", "cat": "Grocery", "pid": "B000SAQCWC", "title": "The Cravings Place Chocolate Chunk Cookie Mix, 23-Ounce Bags (Pack of 6)", "head": "Using these for years - love them.", "body": "As a family allergic to wheat, dairy, eggs, nuts, and several other things, we love the entire Cravings Place line of products as it allows us to bake treats with minimal effort and ingredients. Most allergy-free and gluten-free mixes usually just omit one or two allergens at most, so it's great to see a mix created without many of the most common allergens. (Note these still have soy and corn). We consume these on a regular basis and have been doing so for years.", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2015-08-31"}, {"id": "R1OF8GP57AQ1A0", "cat": "Grocery", "pid": "B00509LVIQ", "title": "Mauna Loa Macadamias, 11 Ounce Packages", "head": "Wonderful", "body": "My favorite nut. Creamy, crunchy, salty, and slightly sweet - what more could you ask for?", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2015-08-31"}, {"id": "R3VDC1QB6MC4ZZ", "cat": "Grocery", "pid": "B00KHXESLC", "title": "Organic Matcha Green Tea Powder - 100% Pure Matcha (No Sugar Added - Unsweetened Pure Green Tea - No Coloring Added Like Others) 4oz", "head": "Five Stars", "body": "This green tea tastes so good! My girlfriend loves it too.", "stars": 1, "hv": 0, "tv": 0, "ver": 0, "vine": 0, "label": "positive", "date": "2015-08-31"}, {"id": "R12FA3DCF8F9ER", "cat": "Grocery", "pid": "B000F8JIIC", "title": "15oz Raspberry Lyons Designer Dessert Syrup Sauce", "head": "Five Stars", "body": "I love Melissa's brand but this is a great second when I can't get Melissa's brand.", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2015-08-31"}, {"id": "RTWHVNV6X4CNJ", "cat": "Grocery", "pid": "B004ZWR9RQ", "title": "Stride Spark Kinetic Fruit Sugar Free Gum, 14-Count (Pack of 12)", "head": "Five Stars", "body": "good", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2015-08-31"}, {"id": "RIG9AWFOGRDVO", "cat": "Grocery", "pid": "B00AL6QBZ6", "title": "Herr's Popcorn Hot Cheese 1 Oz (Pack of 30)", "head": "Not Happy", "body": "The popcorn was stale.", "stars": 0, "hv": 1, "tv": 1, "ver": 1, "vine": 0, "label": "negative", "date": "2015-08-31"}, {"id": "R1S1XSG4ZCHDGS", "cat": "Grocery", "p ew weeks ago and I really like this ring. My fiancee and I scoured around 15 different jewelry shops to look for our wedding bands. I noticed that the mens' bands made from alternative metals were very good in most shops , and in the range of 250-300 dollars. That's already a huge difference from what you'd pay for a white gold or platinum ring. However, most of these alternative metal bands displayed in the shops were size 10 (the standard display size) and given that these rings couldn't be resized they told me I would have to wait 1 or 2 weeks to order them. That's how I started to check out rings online. All I really wanted was a clean, beveled cobalt ring. This ring by Cavalier looks just as good as those I've seen in the shops. The price is unbelievable. I prefer cobalt over tungsten because it has a brighter look that almost resembles white gold. This ring has a very nice texture and I kinda play with it often just as Gollum played with the Ring. I also quite like the fact that the only word in the inside of the ring is \"cobalt\" and none of those fancy phrases such as \"brute\" etc. or a huge brand name that you'll find in other rings. Please keep up the good work Cavalier Jewelers!", "stars": 1, "hv": 2, "tv": 2, "ver": 1, "vine": 0, "label": "positive", "date": "2015-08-31"}, {"id": "RBJNF33NUT0P", "cat": "Jewelry", "pid": "B00GINHC1I", "title": "YAZILIND Valentine Day Gift Cute y Lying Cat Ear Wire Hook Dangle Earrings", "head": "cute!", "body": "awesome for price!", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2015-08-31"}, {"id": "R2N3YGK45E1NY5", "cat": "Jewelry", "pid": "B005SGL2IU", "title": "Sterling Silver Plain 3 mm Classic Domed Wedding Band Thumb Ring (4 to 13)", "head": "Five Stars", "body": "Love it...", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2015-08-31"}, {"id": "R39AQUEXFNKO72", "cat": "Jewelry", "pid": "B00YRYXNMC", "title": "Skyvan One Piece Bride Ankle Bracelet  optimal performance for your WiFi network. It just figures it out on its own. Why I love it: 1) Auto Updates. Probably the one of the main selling points. I have witnessed this first hand. It uses the power of the cloud to update. No security updates to apply, no firmware patches to apply, no need to plug in your laptop to set it up or flash, etc. It does it automatically through the internet. 2) It's fast. I probably have 6-7 devices connected through WiFi and they all perform pretty well. I didn’t notice any performance differences when streaming Netflix or YouTube using the Ethernet connection or Wireless network. 3) The Android app makes it dead simple to share your WiFi password, perform speed tests on your internet connection, see how much bandwidth devices on your network are using, and updated your typical settings you see in a WiFi router. The added bonus is you can even do it from anywhere you have a internet connection. No need to be on your home network. The default settings worked straight out of the box beautifully. (There is an iOS app, which has similar features) 4) There are 2.4GHz and 5GHz antennas which should cover all your devices. The interesting bit for me, was that you only need one SSID for both frequencies. There is no concept of network-name and network-name-5g if you have a used a router in the past that broadcasted both frequencies. It will automatically figure out which is the better frequency for you and use that. 5) No administrator password to remember or gateway ip to remember to update settings. You control everything through your phone, including adding additional managers to administer the device. Although, I haven’t actually had the need to use this, it might come in handy to help a friend or family member if they had some questions. 6) It looks nice enough that I don’t need to hide it in my TV stand and can leave it out in the open. Why you may not like it: 1) The OnHub only has 1 Ethernet port, where as my old router had 4. While I thought I would miss this early on, I actually found that connecting all my devices via WiFi just seemed so much simpler and cleaner. If you need more ports for wired internet access, you will need a switch. 2) There is no web interface to administrate the device, but I didn’t really miss it. Well, okay I will admit I did at first, since I was so use to it from my old access point. After the initial setup though, you don’t really need to touch any settings. As I mentioned before, you control everything through your phone, if you need to change anything or check the status. Future Wish List: There is a pretty nice looking speaker on top that I heard during setup. It would be cool if this could be used in some other ways, other than just for setup. Maybe a future update?use that. 5) No administrator password to remember or gateway ip to remember to update settings. You control everything through your phone, including adding additional managers to administer the device. Although, I haven’t actually had the need to use this, it might come in handy to help a friend or family member if they had some questions. 6) It looks nice enough that I don’t need to hide it in my TV stand and can leave it out in the open. Why you may not like it: 1) The OnHub only has 1 Ethernet port, where as my old router had 4. While I thought I would miss this early on, I actually found that connecting all my devices via WiFi just seemed so much simpler and cleaner. If you need more ports for wired internet access, you will need a switch. 2) There is no web interface to administrate the device, but I didn’t really miss it. Well, okay I will admit I did at first, since I was so use to it from my old access point. After the initial setup though, you don’t really need to touch any settings. As I mentioned before, you control everything through your phone, if you need to change anything or check the status. Future Wish List: There is a pretty nice looking speaker on top that I heard during set , "body": "Replaced my Intel Centrino 2230 with the BCM94352HMB and it wasn't plug and play. A quick hardwired connection and searching for drivers brings up few options as Broadcom doesn't directly support drivers for these Wifi cards. You need to download from a major brand like Asus to acquire the driver I would google BCM94352HMB driver and go to the Wikidevi site and download the Wi-Fi Driver V6.32.223.1 for Windows 7 32bit & 64bit. Its an Asus driver and it works alot better than the Dell driver which I got connections drops with. With the Asus Driver no drops and a perfectly stable connection. Its a hell of an upgrade over the 2230 which is a piece of junk with problematic drivers. Intel makes good CPU's but terrible Wifi cards in the past few years.", "stars": 1, "hv": 3, "tv": 4, "ver": 1, "vine": 0, "label": "positive", "date": "2015-08-31"}, {"id": "RC9AW4HKJ016M", "cat": "PC & Electronics", "pid": "B0091ITP0S", "title": "HDE Rotating iPad Case Magnetic Folding Leather Cover Folio Flip Stand for Apple iPad 2 iPad 3 iPad 4 (Purple Embossed)", "head": "One Star", "body": "IT HAS ALREADY CRACKED AT ONE OF THE CORNERS.", "stars": 0, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "negative", "date": "2015-08-31"}, {"id": "R2ALWJE9N6ZBXD", "cat": "PC & Electronics", "pid": "B008I21EA2", "title": "Linksys AC1750 Wi-Fi Wireless Dual-Band+ Router with Gigabit, Smart Wi-Fi App Enabled to Control Your Network from Anywhere (EA6500)", "head": "Very Disappointed", "body": "Very disappointed the range of the router is very poor no more than 6mts, bought this to substitute the carrier default modem but the one of the carrier has more range.", "stars": 0, "hv": 0, "tv": 0, "ver": 0, "vine": 0, "label": "negative", "date": "2015-08-31"}, {"id": "R2G5FPA4OX37GV", "cat": "PC & Electronics", "pid": "B00MRB7SBO", "title": "iPad Pro 9.7, iPad mini, iPad 234 & iPad Air / Air 2 Tripod Mount Holder + Extendable Camera Tripod Adapter with 360° Med. Locking Ball Head / Hand-Held Monopod Works with Case or Without Case", "head": "Five Stars", "body": "Works well. I use this for my Skype meetings.", "stars": 1, "hv": 1, "tv": 1, "ver": 1, "vine": 0, "label": "positive", "date": "2015-08-31"}, {"id": "R1IKTSEVXSIMOD", "cat": "PC & Electronics", "pid": "B00LLER2CS", "title": "SanDisk 16GB CZ43 Ultra Fit Series USB 3.0 Flash Drive (SDCZ43-016G-G46)", "head": "The encryption software that comes preloaded is really easy to use", "body": "The encryption software that comes preloaded is really easy to use, I wasn't expecting it to be on there, so that was a bonus.", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2015-08-31"}, {"id": "R2YA6G6SRFEWF6", "cat": "PC & Electronics", "pid": "B00B0CQCCC", "title": "TRENDnet Wireless AC1750 Dual Band Gigabit Router with USB Share Port, TEW-812DRU Version 2.1", "head": "Didn't last 2 years.", "body": "I have owned this router for less than 2 years (purchased in November 2013). The range and speed was acceptable, although, for the price I would have liked better. This would probably have been a 3 or 4 star review except, as of mid July, 2015, it has stopped working properly. One day, out of the blue, it no longer provided an internet connection. The wireless network still exists but all devices attached show no internet connection. The same happens for any devices connected via Ethernet through the router. I have tried all the following in troubleshooting: 1: connected straight to the modem and had an internet connection. 2: Reset to factory settings and connected to default network but no internet. 3: Connected replacement router via same ethernet cable to the modem and it provided internet without issue. 4: checked router, power adapter, and Ethernet cable for any signs of damage (we have a cat) but none exist. So, As a result, I am rather upset that this product did not even last 2 years. I paid $135 for this thing new. It I had wanted a disposable product i would have spent 30 bucks on a cheap wireless N router and called it a day. If anyone knows of a fix or something for this issue, I will try it and gladly take this up to 3 or so stars but for the time being, I really believe it deserves one star.", "stars": 0, "hv": 0, "tv": 1, "ver": 1, "vine": 0, "label": "negative", "date": "2015-08-31"}, {"id": "RS9H1N9I3Z1IA", "cat": "PC & Electronics", "pid": "B00GU8W5AE", "title": "Redragon M901 PERDITION 16400 DPI High-Precision Programmable Laser Gaming Mouse for PC, MMO, 18 Programmable Buttons, Weight Tuning Cartridge, 12 Side Buttons, 5 programmable user profiles, Omron Micro Switches (White)", "head": "Awesome gaming mouse", "body": "My first gaming mouse, and this thing is cool! You can customize the dpi, colors, buttons. Mouse is comfortable. With some tweaks on the DPI settings, this mouse is absolutely perfect. 10/10 would buy again. 11/10 with rice", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2015-08-31"}, {"id": "RKKLBI76VTDNT", "cat": "PC & Electronics", "pid": "B00XHMXJQ0", "title": "Mudder MHL Adapter Kit 6.5 Feet/ 2M Micro USB to HDMI Cable 1080p HDTV, Push from Smartphone to TV Multi Control/ Wiplug Cable Converter for Samsung Galaxy S5 S4 S3 Note 4 SM-N910A Galaxy Tab 3 8.0 T310 HTC LG Sony", "head": "One Star", "body": "I cannot get it to work", "stars": 0, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "negative", "date": "2015-08-31"}, {"id": "R2NJ3WFUS4E5G6", "cat": "PC & Electronics", "pid": "B00YGJJQ6U", "title": "Fintie iPad Air 2 Case (2014 Release) - 360 Degree Rotating Stand Protective Case Smart Cover with Auto Sleep / Wake Feature", "head": "Great choices of covers but no Auto-shut off or on", "body": "Love that Finite makes different designs and that the grooves are pretty deep to hold the IPad Air up. That's why I bought the case. But...the auto awake and shut off does not work with my case and not sure why. So I have to set auto-lock in the iPad settings just so it shut lly, Really Fast!!", "body": "I will chime in to say that I have seen the same write/transfer speeds that other reviewers have posted. The drive might be a tad larger than some other flash drives, but the speed is several times faster than my other value-priced models. When transferring video files or a large collection of vacation photos, this drive turns a 15-minute task into a 30-second breeze.", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2015-08-31"}, {"id": "R7ER63LS7Q1O5", "cat": "PC & Electronics", "pid": "B00RXEWOAA", "title": "3.5\" USB External Floppy Disk Drive Portable 1.44 MB FDD for PC Windows 2000/XP/Vista/7/8/10,for Mac,No Extra Driver Required,Plug and Play,Black", "head": "Five Stars", "body": "Love it", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2015-08-31"}, {"id": "R225Y10RRDV5H5", "cat": "PC & Electronics", "pid": "B00X3Z4KXW", "title": "BMOUO KCC036 Samsung Tab A 9.7 Keyboard or Case", "head": "Bought it for someone. It looked okay. Cant ...", "body": "Bought it for someone. It looked okay. Cant comment on its functionality as I am not the one using it.", "stars": 0, "hv": 0, "tv": 3, "ver": 1, "vine": 0, "label": "negative", "date": "2015-08-31"}, {"id": "R2QEQK2UHCZSFZ", "cat": "PC & Electronics", "pid": "B01065S79E", "title": "Seagate Game Drive for Xbox SSD (STFT512400)", "head": "Lacking instructions, but a great looking, functional add-on for any Xbox", "body": "I still recall the day I upgraded my 20GB Xbox 360 HD with a 100GB HD and thinking, \"There, now I'll never have to worry about storage again.\" Fast forward 4 years, lots of Rock Band DLC and the ability to store full games to the HD and I find myself at about 90% full. Enter the Seagate 2TB drive. Now I can have that feeling again of, \"There, now I'll never have to worry about storage again.\" This Seagate game drive seems to be a pretty typical 2TB hard drive, priced similar to other 2TB drives, but with officially licensed Xbox One or Xbox 360 compatibility and design. When you consider the basic Xbox One 500GB console is currently priced around $350 and the newer 1 TB model is about $400, you could get the 500GB model and one of these drives (currently $100) and spend about $450 and have a total of 2.5 TB of storage. Basically, an extra 1.5 TB for an extra $50, which isn't a bad deal. Of course, you have to consider your current usage and potential future storage needs. The main thing I think it lacks is a little more in the way of instructions for transferring data from the console to the drive. While it wasn't that difficult for me to figure out, it might be a little more challenging for a parent who is not as up to speed on how these work. Especially considering it is an officially licensed Xbox product, it was surprising there was little more than a short pamphlet describing the drive's features included. I wish it would have gone into more detail about how it handles in-game DLC licensing content vs game content. It was not the most user friendly in that regard. I finished transferring data and wasn't positive if I was going to be able to play with DLC once it was moved to the drive (I was). A little more clarity in what it would and would not transfer would have been helpful as well as explanation on what you need to do if you use it on an Xbox 360, then upgrade to the Xbox One. I plan to do this in a few weeks, so I mayupdate the review if I hit any other snags in that process.", "stars": 1, "hv": 2, "tv": 2, "ver": 0, "vine": 1, "label": "positive", "date": "2015-08-31"}, {"id": "R35DVC7RZ8BLA0", "cat": "PC & Electronics", "pid": "B00B6KXKKA", "title": "HP Envy Sleekbook 6-1010US 6-1014NR 6-1017CL 6Z-1000 Laptop AC Adapter Charger Power Cord", "head": "Five Stars", "body": "Works", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2015-08-31"}, {"id": "R1F854X0L51448", "cat": "PC & Electronics", "pid": "B00ZWUEN10", "titl   function scoreClause(raw, p) {
    let s = raw.toLowerCase();
    const contribs = [];
    const forcedAspects = new Set();
    for (const [re, w, asp] of PHRASES) {
      s = s.replace(re, m => { contribs.push({ w: m.trim(), v: w, phrase: true }); if (asp) forcedAspects.add(asp); return " "; });
    }
    const toks = s.match(/[a-z][a-z'-]*|\d+/g) || [];
    let negLeft = 0, mult = 1, multLeft = 0;
    for (const t of toks) {
      if (NEGATORS.has(t)) { negLeft = p.negwin; continue; }
      if (BOOST.has(t)) { mult = p.boost; multLeft = 2; continue; }
      if (DAMP.has(t)) { mult = 0.6; multLeft = 2; continue; }
      const base = LEX[t];
      if (base !== undefined) {
        let v = base * (multLeft > 0 ? mult : 1);
        const negated = negLeft > 0;
        if (negated) v = -v * 0.8;
        contribs.push({ w: negated ? "not " + t : t, v: +v.toFixed(3), negated });
        multLeft = 0;
      }
      if (negLeft > 0) negLeft--;
      if (multLeft > 0) multLeft--;
    }
    const aspects = ASPECTS.filter(a => a.re.test(raw)).map(a => a.id);
    forcedAspects.forEach(a => { if (!aspects.includes(a)) aspects.push(a); });
    const score = contribs.reduce((x, c) => x + c.v, 0);
    return { text: raw, score: +score.toFixed(3), contribs, aspects };
  }

  function analyze(head, body, params) {
    const p = Object.assign({}, DEF, params || {});
    const text = String(body || "").trim();
    const h = String(head || "").trim();
    if (!text && !h) return { empty: true, label: "empty", score: 0, posSum: 0, negSum: 0, clauses: [], aspects: [] };
    const clauses = [];
    for (const [src, t, w] of [["headline", h, p.headw], ["body", text, 1]]) {
      if (!t) continue;
      for (const c of splitClauses(t)) {
        const k = scoreClause(c, p);
        k.src = src; k.score = +(k.score * w).toFixed(3);
        k.contribs = k.contribs.map(x => ({ ...x, v: +(x.v * w).toFixed(3) }));
        if (k.contribs.length || k.aspects.length) clauses.push(k);
      }
    }
    let posSum = 0, negSum = 0;
    clauses.forEach(c => { if (c.score > 0) posSum += c.score; else negSum += -c.score; });
    const total = posSum - negSum;
    let label;
    if (Math.min(posSum, negSum) >= p.mixed && Math.min(posSum, negSum) / Math.max(posSum, negSum) >= 0.3) label = "mixed";
    else if (total > p.band) label = "positive";
    else if (total < -p.band) label = "negative";
    else label = "neutral";

    const map = {};
    clauses.forEach(c => c.aspects.forEach(id => {
      const m = map[id] || (map[id] = { id, label: LABEL[id], score: 0, clauses: [] });
      m.score += c.score; m.clauses.push(c.text);
    }));
    const aspects = Object.values(map).map(m => ({
      ...m, score: +m.score.toFixed(3),
      sent: m.score >= p.band ? "positive" : m.score <= -p.band ? "negative" : "neutral",
    }));
    return { empty: false, label, score: +total.toFixed(3), posSum: +posSum.toFixed(3), negSum: +negSum.toFixed(3), clauses, aspects };
  }

  return { analyze, ASPECTS, LABEL, DEF, LEX };
})();
if (typeof module !== "undefined") module.exports = RR;
</script>
<script>(() => {
"use strict";
const D = window.RR_DATA;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n, d = 0) => Number(n).toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (a, b) => (b ? (100 * a) / b : 0);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const COL = { positive: "var(--pos)", negative: "var(--red)", neutral: "var(--yel)", mixed: "var(--org)" };
const SERIES = ["#FF7043", "#2dd4bf", "#FFC928", "#E53935", "#7aa2ff", "#c084fc"];
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

/* ---------- state ---------- */
const P = { ...RR.DEF };
const S = { all: D.reviews.map(r => ({ ...r, wc: (r.head + " " + r.body).trim().split(/\s+/).length })), cats: new Set(D.cats), catList: [...D.cats], page: "overview", AN: [] };
const E = { q: "", sent: "all", aspect: "all", sort: "score_asc", minHv: 0, wmin: 0, wmax: 9999, minAbs: 0, ver: false, dis: false, page: 0, open: new Set() };
const V = { topN: 8, pick: null, axes: 8, cmp: new Set(D.cats.slice(0, 4)), A: D.cats[0], B: D.cats[1] || D.cats[0], live: false };

function analyzeAll() { S.AN = S.all.map(r => ({ r, a: RR.analyze(r.head, r.body, P) })); }
const view = () => S.AN.filter(x => S.cats.has(x.r.cat));
function labelCounts(items) { const c = { positive: 0, negative: 0, neutral: 0, mixed: 0 }; items.forEach(({ a }) => { if (c[a.label] !== undefined) c[a.label]++; }); return c; }
function aspectStats(items) {
  const m = {};
  for (const { a } of items) for (const x of a.aspects) {
    const e = m[x.id] || (m[x.id] = { id: x.id, label: x.label, n: 0, pos: 0, neg: 0, neu: 0 });
    e.n++; e[x.sent === "positive" ? "pos" : x.sent === "negative" ? "neg" : "neu"]++;
  }
  return Object.values(m).map(e => ({ ...e, net: (e.pos - e.neg) / e.n }));
}
function agreement(items) {
  const lab = items.filter(x => x.r.label === "positive" || x.r.label === "negative");
  const dec = lab.filter(x => x.a.label === "positive" || x.a.label === "negative");
  const ok = dec.filter(x => x.a.label === x.r.label).length;
  const f1 = cls => { const tp = lab.filter(x => x.r.label === cls && x.a.label === cls).length, pr = lab.filter(x => x.a.label === cls).length, re = lab.filter(x => x.r.label === cls).length; const p = pr ? tp / pr : 0, r = re ? tp / re : 0; return { p, r, f: p + r ? (2 * p * r) / (p + r) : 0 }; };
  return { labeled: lab.length, decisive: dec.length, ok, acc: dec.length ? ok / dec.length : 0, cov: lab.length ? dec.length / lab.length : 0, pos: f1("positive"), neg: f1("negative"), macro: (f1("positive").f + f1("negative").f) / 2 };
}

/* ---------- ui helpers ---------- */
function toast(msg, kind = "") { const t = document.createElement("div"); t.className = "toast " + kind; t.textContent = msg; $("#toasts").append(t); setTimeout(() => t.remove(), 3800); }
function confirmDlg(msg) { return new Promise(res => { const d = $("#dlg"); $("#dlg-msg").textContent = msg; d.onclose = () => res(d.returnValue === "yes"); d.showModal(); }); }
function download(name, rows) {
  const q = v => { let s = String(v ?? ""); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
  const blob = new Blob(["﻿" + rows.map(r => r.map(q).join(",")).join("\r\n")], { type: "text/csv" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  toast(`Exported ${rows.length - 1} rows → ${name}`, "ok");
}
async function copy(text) { try { await navigator.clipboard.writeText(text); toast("Copied to clipboard", "ok"); } catch { const t = document.createElement("textarea"); t.value = text; document.body.append(t); t.select(); document.execCommand("copy"); t.remove(); toast("Copied", "ok"); } }
const tag = (sent, label, n) => `<span class="tag ${sent}" data-tip="${esc(sent)} mentions: ${n ?? ""}">${sent === "positive" ? "Positive" : sent === "negative" ? "Negative" : sent === "mixed" ? "Mixed" : "Neutral"} — ${esc(label)}${n != null ? ` <b>${n}</b>` : ""}</span>`;
const lblTag = l => `<span class="tag ${l}">${l}</span>`;
const kpi = (label, value, sub, c = "var(--org)", w = 50) => `<div class="kpi" style="--c:${c};--w:${clamp(w, 4, 100)}%"><span>${label}</span><b>${value}</b><small>${sub || ""}</small></div>`;
const panel = (title, hint, body, extra = "") => `<section class="panel ${extra}"><h2>${title}</h2>${hint ? `<p class="hint">${hint}</p>` : ""}${body}</section>`;

/* tooltips */
const tip = $("#tip");
document.addEventListener("mouseover", e => { const t = e.target.closest("[data-tip]"); if (!t) return; tip.textContent = t.dataset.tip; tip.style.display = "block"; });
document.addEventListener("mousemove", e => { if (tip.style.display === "block") { tip.style.left = Math.min(e.clientX + 14, innerWidth - 290) + "px"; tip.style.top = e.clientY + 16 + "px"; } });
document.addEventListener("mouseout", e => { if (e.target.closest("[data-tip]")) tip.style.display = "none"; });

/* ---------- charts ---------- */
function donut(parts, label) {
  const tot = parts.reduce((a, p) => a + p.val, 0) || 1, R = 54, C = 2 * Math.PI * R; let off = 0;
  const arcs = parts.filter(p => p.val).map(p => { const len = (p.val / tot) * C, s = `<circle cx="80" cy="80" r="${R}" fill="none" stroke-width="20" style="stroke:${p.color}" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)" data-tip="${esc(p.label)}: ${p.val} (${fmt(pct(p.val, tot), 1)}%)"/>`; off += len; return s; }).join("");
  return `<svg viewBox="0 0 160 160" width="170" height="170" role="img" aria-label="${esc(label)}"><circle cx="80" cy="80" r="${R}" fill="none" stroke="var(--line)" stroke-width="20"/>${arcs}<text x="80" y="78" text-anchor="middle" style="font-size:24px;fill:var(--txt);font-weight:600">${fmt(tot)}</text><text x="80" y="96" text-anchor="middle" class="lbl">reviews</text></svg>`;
}
function stackRow(label, c, order = ["positive", "mixed", "neutral", "negative"]) {
  const n = order.reduce((a, k) => a + (c[k] || 0), 0) || 1;
  return `<div class="srow"><span class="sl" title="${esc(label)}">${esc(label)}</span><div class="sbar">${order.map(k => c[k] ? `<i style="width:${pct(c[k], n)}%;background:${COL[k]}" data-tip="${k}: ${c[k]} (${fmt(pct(c[k], n), 1)}%)"></i>` : "").join("")}</div><span class="sn">${n === 1 && !Object.values(c).some(Boolean) ? 0 : n}</span></div>`;
}
function divBars(items, pick) {
  if (!items.length) return `<div class="empty">No aspect has reached the minimum support of ${P.minSupport} mentions yet.</div>`;
  return items.map(e => `<button class="dvrow ${pick === e.id ? "sel" : ""}" data-asp="${e.id}" data-tip="${e.pos} positive · ${e.neg} negative · ${e.neu} neutral of ${e.n} mentions"><span class="dl">${esc(e.label)}</span><span class="dv"><span><span class="l" style="display:block;width:${pct(e.neg, e.n)}%"></span></span><span class="ax"></span><span><span class="r" style="display:block;width:${pct(e.pos, e.n)}%"></span></span></span><span class="dn">${e.net >= 0 ? "+" : ""}${fmt(e.net * 100)} · n${e.n}</span></button>`).join("");
}
function radar(axes, series) {
  const W = 460, cx = W / 2, cy = W / 2 + 6, R = 150, k = axes.length;
  if (k < 3) return `<div class="empty">Need at least 3 aspects above the support threshold to draw a radar. Lower <b>Min aspect support</b> in the rack.</div>`;
  const ang = i => -Math.PI / 2 + (2 * Math.PI * i) / k, pt = (i, net) => { const r = ((net + 1) / 2) * R; return [cx + r * Math.cos(ang(i)), cy + r * Math.sin(ang(i))]; };
  let g = [0, 0.5, 1].map(f => `<circle cx="${cx}" cy="${cy}" r="${R * f}" fill="none" stroke="var(--line2)" ${f === 0.5 ? 'stroke-dasharray="4 4"' : ""}/>`).join("");
  g += `<text x="${cx + 4}" y="${cy - R / 2 - 3}" class="lbl">0 (neutral)</text><text x="${cx + 4}" y="${cy - R - 3}" class="lbl">+100</text>`;
  axes.forEach((a, i) => { const [x, y] = pt(i, 1.0), [lx, ly] = pt(i, 1.28); g += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/><text x="${lx}" y="${ly}" text-anchor="${Math.abs(lx - cx) < 12 ? "middle" : lx > cx ? "start" : "end"}" class="lbl" style="fill:var(--txt)">${esc(a.label.length > 17 ? a.label.slice(0, 16) + "…" : a.label)}</text>`; });
  series.forEach(s => {
    const pts = axes.map((a, i) => pt(i, s.vals[a.id] ?? 0));
    g += `<polygon points="${pts.map(p => p.join(",")).join(" ")}" fill="${s.color}" fill-opacity=".14" stroke="${s.color}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const v = s.vals[a.id]; if (v !== undefined) g += `<circle cx="${pts[i][0]}" cy="${pts[i][1]}" r="4" fill="${s.color}" data-tip="${esc(s.name)} · ${esc(a.label)}: net ${v >= 0 ? "+" : ""}${fmt(v * 100)}${s.n?.[a.id] ? " (n=" + s.n[a.id] + ")" : ""}"/>`; });
  });
  return `<svg viewBox="-90 0 ${W + 180} ${W + 12}" width="100%" style="max-width:640px;display:block;margin:auto" role="img" aria-label="Aspect radar">${g}</svg>`;
}
function histogram(vals, { lo = -6, hi = 6, bins = 24, band = P.band, h = 150 } = {}) {
  const W = 560, bw = (hi - lo) / bins, cnt = Array(bins).fill(0);
  vals.forEach(v => { cnt[clamp(Math.floor((v - lo) / bw), 0, bins - 1)]++; });
  const mx = Math.max(1, ...cnt), x = v => ((v - lo) / (hi - lo)) * W;
  const bars = cnt.map((c, i) => { const mid = lo + (i + 0.5) * bw, hh = (c / mx) * (h - 24); return `<rect x="${(i * W) / bins + 1}" y="${h - 18 - hh}" width="${W / bins - 2}" height="${hh}" rx="3" style="fill:${mid < -band ? "var(--red)" : mid > band ? "var(--pos)" : "var(--yel)"}" opacity=".85" data-tip="score ${fmt(lo + i * bw, 1)} … ${fmt(lo + (i + 1) * bw, 1)}: ${c} reviews"/>`; }).join("");
  return `<svg viewBox="0 0 ${W} ${h}" width="100%" role="img" aria-label="Score distribution">${bars}<line x1="${x(-band)}" x2="${x(-band)}" y1="4" y2="${h - 18}" stroke="var(--red)" stroke-dasharray="4 3"/><line x1="${x(band)}" x2="${x(band)}" y1="4" y2="${h - 18}" stroke="var(--pos)" stroke-dasharray="4 3"/><text x="2" y="${h - 3}" class="lbl">${lo}</text><text x="${W / 2}" y="${h - 3}" text-anchor="middle" class="lbl">lexicon score (neutral band ±${fmt(band, 2)})</text><text x="${W - 2}" y="${h - 3}" text-anchor="end" class="lbl">+${hi}</text></svg>`;
}
function scatter(pts) {
  const W = 560, H = 230, mxX = 160;
  const dots = pts.map(p => `<circle cx="${40 + (Math.min(p.x, mxX) / mxX) * (W - 50)}" cy="${H / 2 + 6 - (clamp(p.y, -6, 6) / 6) * (H / 2 - 22)}" r="3.6" style="fill:${p.l === "negative" ? "var(--red)" : p.l === "positive" ? "var(--pos)" : "var(--dim)"}" opacity=".75" data-tip="${esc(p.t)}"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Words vs score"><line x1="40" x2="${W - 10}" y1="${H / 2 + 6}" y2="${H / 2 + 6}" stroke="var(--line2)" stroke-dasharray="4 4"/><line x1="40" x2="40" y1="10" y2="${H - 22}" stroke="var(--line2)"/>${dots}<text x="${W / 2}" y="${H - 4}" text-anchor="middle" class="lbl">review length (words, capped at ${mxX})</text><text x="6" y="16" class="lbl">+6</text><text x="6" y="${H - 26}" class="lbl">-6</text></svg>`;
}
const heat = net => net >= 0 ? `rgba(45,212,191,${0.18 + 0.7 * net})` : `rgba(229,57,53,${0.2 + 0.7 * -net})`;

/* ---------- pages ---------- */
const PAGES = [
  { id: "overview", name: "Signal Deck", icon: "◉" }, { id: "explorer", name: "Review Explorer", icon: "☰" },
  { id: "aspects", name: "Aspect Lab", icon: "✦" }, { id: "compare", name: "Compare", icon: "⇄" },
  { id: "analyzer", name: "Live Analyzer", icon: "⌁" }, { id: "model", name: "Model Lab", icon: "⚙" }, { id: "data", name: "Data & Export", icon: "⇩" },
];
const pages = {};
const head = (t, tt, sub) => `<h1>${t}<small>${tt}</small></h1><p class="sub">${sub}</p>`;
const noData = () => `<div class="empty">No reviews in the current category selection. Toggle a category chip above.</div>`;

/* Overview */
pages.overview = {
  render(el) {
    el.innerHTML = head("Signal Deck", "OVERVIEW", "Every figure below is computed from the CSV rows in your browser, using the engine settings in the tuning rack.") +
      `<div class="grid g-kpi" id="ov-kpi"></div><div class="grid g2" style="margin-top:14px"><div id="ov-cat"></div><div id="ov-donut"></div></div>
       <div class="grid g2" style="margin-top:14px"><div id="ov-asp"></div><div id="ov-tags"></div></div><div style="margin-top:14px" id="ov-hist"></div>`;
    this.draw();
  },
  draw() {
    const items = view(); if (!$("#ov-kpi")) return;
    if (!items.length) { $("#ov-kpi").innerHTML = noData(); return; }
    const n = items.length, c = labelCounts(items), ag = agreement(items), st = aspectStats(items);
    $("#ov-kpi").innerHTML = kpi("Reviews", fmt(n), `${new Set(items.map(x => x.r.pid)).size} distinct products`, "var(--org)", 100) +
      kpi("Positive", fmt(pct(c.positive, n), 1) + "%", `${c.positive} reviews`, "var(--pos)", pct(c.positive, n)) +
      kpi("Negative", fmt(pct(c.negative, n), 1) + "%", `${c.negative} reviews`, "var(--red)", pct(c.negative, n)) +
      kpi("Mixed / neutral", fmt(pct(c.mixed + c.neutral, n), 1) + "%", `${c.mixed} mixed · ${c.neutral} neutral`, "var(--yel)", pct(c.mixed + c.neutral, n)) +
      kpi("Label agreement", ag.decisive ? fmt(ag.acc * 100, 1) + "%" : "n/a", `on ${ag.decisive} of ${ag.labeled} labelled reviews the engine called`, "var(--pos)", ag.acc * 100) +
      kpi("Aspects found", st.length, `${st.filter(e => e.n >= P.minSupport).length} meet support ≥ ${P.minSupport}`, "var(--org)", 60);
    $("#ov-cat").innerHTML = panel("Sentiment by category", "Top bar: engine. Thin bar: dataset's own label (positive/negative only).",
      [...S.cats].filter(k => items.some(x => x.r.cat === k)).map(k => { const it = items.filter(x => x.r.cat === k), lc = { positive: 0, negative: 0, neutral: 0, mixed: 0 }; it.forEach(x => { if (x.r.label) lc[x.r.label] = (lc[x.r.label] || 0) + 1; }); return stackRow(k, labelCounts(it)) + `<div class="srow" style="margin:-4px 0 8px"><span></span><div class="sbar thin">${["positive", "negative"].map(l => lc[l] ? `<i style="width:${pct(lc[l], it.length)}%;background:${COL[l]};opacity:.55" data-tip="dataset label ${l}: ${lc[l]}"></i>` : "").join("")}</div><span></span></div>`; }).join("") +
      `<div class="tags" style="margin-top:10px">${["positive", "mixed", "neutral", "negative"].map(lblTag).join("")}</div>`);
    $("#ov-donut").innerHTML = panel("Verdict mix", "Engine verdict across the selected categories.", `<div class="row" style="justify-content:space-around">${donut(["positive", "mixed", "neutral", "negative"].map(k => ({ label: k, val: c[k], color: COL[k] })), "Verdict mix")}<div>${["positive", "mixed", "neutral", "negative"].map(k => `<div class="row"><i style="width:10px;height:10px;border-radius:3px;background:${COL[k]}"></i><span class="mono">${k}</span><b class="mono">${c[k]}</b></div>`).join("")}</div></div>`);
    const el = st.filter(e => e.n >= P.minSupport).sort((a, b) => b.n - a.n), hidden = st.length - el.length;
    $("#ov-asp").innerHTML = panel("Most-mentioned aspects", "Bars: share of mentions that were negative (left) vs positive (right). Click a row for evidence.",
      `<div class="controls" style="margin-bottom:8px"><div><label>Aspects shown<output>${V.topN}</output></label><input type="range" id="topn" min="3" max="15" value="${V.topN}"></div></div>` + divBars(el.slice(0, V.topN)) +
      (hidden ? `<p class="hint" style="margin-top:10px">${hidden} aspect${hidden > 1 ? "s are" : " is"} hidden: fewer than ${P.minSupport} mentions (the min-support rule keeps one-off words out of the tags).</p>` : ""));
    $("#topn").oninput = e => { V.topN = +e.target.value; this.draw(); $("#topn")?.focus(); };
    $$("#ov-asp .dvrow").forEach(b => b.onclick = () => { V.pick = b.dataset.asp; go("aspects"); });
    const top = (k) => el.filter(e => e[k] > 0).sort((a, b) => b[k] - a[k]).slice(0, 6);
    $("#ov-tags").innerHTML = panel("Top generated tags", "Click a tag to open matching reviews.", `<h2 style="margin-top:6px">Praised</h2><div class="tags" style="margin:6px 0 14px">${top("pos").map(e => `<button class="tag positive" data-a="${e.id}" data-s="positive">Positive — ${esc(e.label)} <b>${e.pos}</b></button>`).join("") || '<span class="dim">none yet</span>'}</div><h2>Criticised</h2><div class="tags" style="margin-top:6px">${top("neg").map(e => `<button class="tag negative" data-a="${e.id}" data-s="negative">Negative — ${esc(e.label)} <b>${e.neg}</b></button>`).join("") || '<span class="dim">none yet</span>'}</div>`);
    $$("#ov-tags button.tag").forEach(b => b.onclick = () => { Object.assign(E, { aspect: b.dataset.a, sent: "all", page: 0 }); go("explorer"); });
    $("#ov-hist").innerHTML = panel("Score distribution", "Each bar counts reviews at that lexicon score. Dashed lines are the neutral band from the rack.", histogram(items.map(x => x.a.score)));
  },
};

/* Explorer */
pages.explorer = {
  render(el) {
    const mxH = Math.max(1, ...S.AN.map(x => x.r.hv)), mxW = Math.max(...S.AN.map(x => x.r.wc));
    if (E.wmax === 9999) E.wmax = mxW;
    el.innerHTML = head("Review Explorer", "SEARCH · FILTER · INSPECT", "Expand any review to see exactly which clauses and words produced its tags.") +
      panel("Filters", "", `<div class="controls">
        <div><label for="q">Search text</label><input id="q" type="search" placeholder="battery, broke, love…" value="${esc(E.q)}"></div>
        <div><label for="fs">Verdict</label><select id="fs"><option value="all">All</option>${["positive", "negative", "mixed", "neutral"].map(k => `<option ${E.sent === k ? "selected" : ""}>${k}</option>`).join("")}</select></div>
        <div><label for="fa">Aspect</label><select id="fa"><option value="all">All aspects</option>${RR.ASPECTS.map(a => `<option value="${a.id}" ${E.aspect === a.id ? "selected" : ""}>${esc(a.label)}</option>`).join("")}</select></div>
        <div><label for="so">Sort</label><select id="so">${[["score_asc", "Most negative first"], ["score_desc", "Most positive first"], ["hv", "Most helpful votes"], ["len", "Longest"]].map(([v, t]) => `<option value="${v}" ${E.sort === v ? "selected" : ""}>${t}</option>`).join("")}</select></div>
        <div><label>Min helpful votes<output id="o-hv">${E.minHv}</output></label><input type="range" id="hv" min="0" max="${mxH}" value="${E.minHv}"></div>

      `<div id="ex-res" style="margin-top:14px"></div>`;
    const on = (id, key, num, out) => { $(id).oninput = e => { E[key] = num ? +e.target.value : e.target.value; if (out) $(out).textContent = key === "minAbs" ? fmt(E[key], 1) : E[key]; E.page = 0; this.draw(); }; };
