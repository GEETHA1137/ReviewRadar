<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ReviewRadar</title>
<style>:root{
  --red:#E53935;--org:#FF7043;--yel:#FFC928;--pos:#2dd4bf;
  --bg:#080b11;--panel:#0f141d;--panel2:#141b27;--line:#1c2535;--line2:#2a364b;
  --txt:#e7ebf3;--mut:#8b97ad;--dim:#5b667b;--grid:rgba(255,255,255,.035);
  --mono:ui-monospace,"JetBrains Mono","Cascadia Code",Consolas,Menlo,monospace;
  --sans:Inter,system-ui,"Segoe UI",Roboto,sans-serif;--r:14px;
}
[data-theme=light]{--bg:#f5f5f5;--panel:#fff;--panel2:#f0f2f6;--line:#e1e5ec;--line2:#cdd4df;--txt:#1d2430;--mut:#566177;--dim:#8793a8;--grid:rgba(0,0,0,.04);--pos:#0f9b8e}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);font:14px/1.5 var(--sans);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:44px 44px}
body::before{content:"";position:fixed;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,var(--red),var(--org),var(--yel));z-index:50}
.skip{position:absolute;left:-999px}.skip:focus{left:12px;top:12px;background:var(--yel);color:#000;padding:6px 10px;border-radius:8px;z-index:99}
#app{display:grid;grid-template-columns:268px 1fr;min-height:100vh}
#side{position:sticky;top:0;height:100vh;overflow:auto;background:linear-gradient(180deg,var(--panel),var(--bg));border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;gap:10px;align-items:center}.brand b{font-size:17px;letter-spacing:.2px}.brand small{display:block;color:var(--mut);font:11px var(--mono);text-transform:uppercase;letter-spacing:1px}
.sweep{transform-origin:20px 20px;animation:spin 5s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.sweep{animation:none}*{transition:none!important}}
#nav{display:flex;flex-direction:column;gap:3px}
#nav button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;color:var(--mut);transition:.15s}
#nav button:hover{background:var(--panel2);color:var(--txt)}#nav button:focus-visible,.btn:focus-visible,.pill:focus-visible,.chip:focus-visible{outline:2px solid var(--yel);outline-offset:2px}
#nav button.on{background:linear-gradient(90deg,rgba(229,57,53,.18),rgba(255,201,40,.06));color:var(--txt);box-shadow:inset 2px 0 0 var(--org)}
#nav kbd{margin-left:auto;font:10px var(--mono);color:var(--dim)}#nav i{font-style:normal;width:18px;text-align:center;color:var(--org)}
.rack{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--panel)}
.rack-h{display:flex;justify-content:space-between;font:11px var(--mono);letter-spacing:1.4px;color:var(--mut);margin-bottom:8px}
.lnk{all:unset;cursor:pointer;color:var(--org);font:11px var(--mono)}.lnk:hover{text-decoration:underline}
.presets{display:flex;gap:6px;margin-bottom:10px}.presets button{flex:1;font:11px var(--mono);padding:5px;border-radius:8px;border:1px solid var(--line2);background:transparent;color:var(--mut);cursor:pointer}
.presets button:hover{color:var(--txt);border-color:var(--org)}
.knob{margin:10px 0}.knob label{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}.knob output{font:12px var(--mono);color:var(--yel)}
.knob small{display:block;color:var(--dim);font-size:11px;line-height:1.3;margin-top:2px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--red),var(--org),var(--yel))}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--red),var(--org),var(--yel))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--bg);border:2px solid var(--yel);margin-top:-6px;box-shadow:0 0 0 3px rgba(255,201,40,.15)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--yel)}
input[type=range]:focus-visible{outline:2px solid var(--yel);outline-offset:2px;border-radius:6px}
#main{min-width:0}#top{position:sticky;top:2px;z-index:20;display:flex;gap:10px;align-items:center;padding:10px 22px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
#chips{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.chip{font:12px var(--mono);padding:5px 10px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:var(--mut);cursor:pointer;transition:.15s}
.chip.on{background:rgba(255,112,67,.14);border-color:var(--org);color:var(--txt)}.chip:hover{border-color:var(--yel)}
.pill{font:11px var(--mono);padding:6px 10px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);color:var(--mut);cursor:pointer;display:flex;gap:7px;align-items:center}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--org);box-shadow:0 0 8px var(--org)}
.btn{font:13px var(--sans);padding:7px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);color:var(--txt);cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--org)}.btn.pri{background:linear-gradient(90deg,var(--red),var(--org));border-color:transparent;color:#fff;font-weight:600}
.btn.ghost{background:transparent}.btn.danger{background:var(--red);border-color:var(--red);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}
#menu{display:none}
#view{padding:22px;max-width:1280px;outline:none}
h1{font-size:24px;margin:0 0 2px;letter-spacing:-.3px}h1 small{font:12px var(--mono);color:var(--org);margin-left:8px;letter-spacing:1px}
.sub{color:var(--mut);margin:0 0 18px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g-kpi{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.panel{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.panel h2{margin:0 0 2px;font-size:13px;font-family:var(--mono);letter-spacing:1.2px;text-transform:uppercase;color:var(--mut);font-weight:600}
.panel .hint{color:var(--dim);font-size:12px;margin:0 0 12px}.panel-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:var(--w,40%);background:var(--c,var(--org))}
.kpi span{font:11px var(--mono);letter-spacing:1px;color:var(--mut);text-transform:uppercase}.kpi b{display:block;font:600 28px var(--mono);margin:4px 0 0}.kpi small{color:var(--dim);font-size:12px}
.tag{display:inline-flex;gap:5px;align-items:center;font:12px var(--mono);padding:3px 9px;border-radius:999px;border:1px solid;white-space:nowrap;cursor:default}
.tag b{font-weight:600}.tag.positive{color:var(--pos);border-color:color-mix(in srgb,var(--pos) 45%,transparent);background:color-mix(in srgb,var(--pos) 10%,transparent)}
.tag.negative{color:var(--red);border-color:color-mix(in srgb,var(--red) 50%,transparent);background:color-mix(in srgb,var(--red) 10%,transparent)}
.tag.neutral{color:var(--yel);border-color:color-mix(in srgb,var(--yel) 45%,transparent);background:color-mix(in srgb,var(--yel) 8%,transparent)}
.tag.mixed{color:var(--org);border-color:color-mix(in srgb,var(--org) 50%,transparent);background:color-mix(in srgb,var(--org) 10%,transparent)}
button.tag{cursor:pointer;font-family:var(--mono)}button.tag:hover{filter:brightness(1.25)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.srow{display:grid;grid-template-columns:120px 1fr 44px;gap:10px;align-items:center;margin:7px 0;font-size:12px}
.srow .sl{color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.srow .sn{font:12px var(--mono);color:var(--dim);text-align:right}
.sbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line)}.sbar i{display:block;height:100%;transition:width .3s}
.sbar.thin{height:6px;margin-top:3px}
.dvrow{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;margin:6px 0;font-size:12px;cursor:pointer;border-radius:8px;padding:2px 4px;background:none;border:0;color:inherit;width:100%;text-align:left}
.dvrow:hover,.dvrow.sel{background:var(--panel2)}.dvrow .dl{color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dv{display:grid;grid-template-columns:1fr 2px 1fr;align-items:center}.dv>span{display:block;height:14px}.dv .l{display:block;margin-left:auto;background:var(--red);height:14px;border-radius:5px 0 0 5px;min-width:0}.dv .r{display:block;background:var(--pos);height:14px;border-radius:0 5px 5px 0}.dv .ax{background:var(--line2);height:22px;align-self:center}
.dvrow .dn{font:11px var(--mono);color:var(--mut);text-align:right}
table{width:100%;border-collapse:collapse;font-size:13px}th{font:11px var(--mono);letter-spacing:1px;text-transform:uppercase;color:var(--mut);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line2)}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}td.num,th.num{text-align:right;font-family:var(--mono)}
.scroll{overflow:auto;max-width:100%}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;align-items:end}
.controls label,.field label{display:block;font:11px var(--mono);letter-spacing:.8px;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
.controls output{color:var(--yel);margin-left:6px}
input[type=text],input[type=search],select,textarea{width:100%;background:var(--bg);color:var(--txt);border:1px solid var(--line2);border-radius:10px;padding:8px 10px;font:13px var(--sans)}
textarea{min-height:140px;resize:vertical;line-height:1.55}input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--yel);outline-offset:1px}
.rv{border:1px solid var(--line);border-radius:12px;background:var(--panel);margin:8px 0;overflow:hidden}
.rv-head{display:grid;grid-template-columns:1fr auto;gap:10px;padding:11px 14px;cursor:pointer;width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit}
.rv-head:hover{background:var(--panel2)}.rv-title{font-weight:600}.rv-meta{color:var(--mut);font-size:12px;margin:2px 0 6px;font-family:var(--mono)}
.rv-body{display:none;padding:4px 14px 14px;border-top:1px dashed var(--line2)}.rv.open .rv-body{display:block}
mark{background:none;border-radius:4px;padding:1px 3px}mark.positive{background:color-mix(in srgb,var(--pos) 22%,transparent)}mark.negative{background:color-mix(in srgb,var(--red) 26%,transparent)}
.w{display:inline-block;font:11px var(--mono);padding:2px 6px;margin:2px;border-radius:6px}.w.p{background:color-mix(in srgb,var(--pos) 16%,transparent);color:var(--pos)}.w.n{background:color-mix(in srgb,var(--red) 18%,transparent);color:var(--red)}
.score{font:600 15px var(--mono);text-align:right}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}
.empty{padding:28px;text-align:center;color:var(--mut);border:1px dashed var(--line2);border-radius:12px}
.note{border-left:3px solid var(--yel);background:color-mix(in srgb,var(--yel) 7%,transparent);padding:10px 12px;border-radius:0 10px 10px 0;color:var(--mut);font-size:13px}
.note.red{border-color:var(--red);background:color-mix(in srgb,var(--red) 8%,transparent)}.note b{color:var(--txt)}
.mono{font-family:var(--mono)}.mut{color:var(--mut)}.dim{color:var(--dim)}
.cm td,.cm th{text-align:center}.cm td{font:600 16px var(--mono)}.cm td small{display:block;font:11px var(--mono);color:var(--mut);font-weight:400}
.hm{border-collapse:separate;border-spacing:3px}.hm td{padding:0;border:0}.hm .c{display:block;height:34px;line-height:34px;text-align:center;border-radius:6px;font:11px var(--mono);color:#fff;min-width:56px}
.hm th{font-size:10px;max-width:80px;white-space:normal;text-align:center}.hm th.r{text-align:right;white-space:nowrap;padding-right:8px;min-width:120px}
.drop{border:2px dashed var(--line2);border-radius:var(--r);padding:26px;text-align:center;color:var(--mut);transition:.15s}.drop.over{border-color:var(--yel);background:color-mix(in srgb,var(--yel) 6%,transparent)}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;margin:14px 0 0;font:12px var(--mono);color:var(--mut)}
#tip{position:fixed;z-index:90;pointer-events:none;background:#000d;color:#fff;border:1px solid var(--line2);padding:6px 9px;border-radius:8px;font:12px var(--mono);max-width:280px;display:none;backdrop-filter:blur(6px)}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:95}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--org);padding:10px 14px;border-radius:10px;font-size:13px;max-width:340px;animation:in .2s ease}.toast.ok{border-left-color:var(--pos)}.toast.err{border-left-color:var(--red)}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
dialog{background:var(--panel);color:var(--txt);border:1px solid var(--line2);border-radius:var(--r);padding:20px;max-width:420px}dialog::backdrop{background:#000a}
svg text{font-family:var(--mono);fill:var(--mut)}svg .lbl{font-size:11px}
#scrim{display:none}
@media (max-width:1000px){.g2,.g3{grid-template-columns:1fr}}
@media (max-width:820px){
  #app{grid-template-columns:1fr}#menu{display:block}
  #side{position:fixed;left:0;top:0;bottom:0;width:280px;z-index:60;transform:translateX(-102%);transition:transform .2s}
  body.nav-open #side{transform:none}body.nav-open #scrim{display:block;position:fixed;inset:0;background:#0008;z-index:55}
  #view{padding:14px}#top{padding:8px 12px}.srow{grid-template-columns:90px 1fr 36px}.dvrow{grid-template-columns:110px 1fr 56px}
}
</style>
</head>

<div id="app">

        <circle cx="20" cy="20" r="17" fill="none" stroke="var(--line2)" stroke-width="1.5"/>

        <path d="M20 20 L20 3 A17 17 0 0 1 35 12 Z" fill="url(#g)" opacity=".9" class="sweep"/>
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E53935"/><stop offset=".5" stop-color="#FF7043"/><stop offset="1" stop-color="#FFC928"/></linearGradient></defs>
        <circle cx="27" cy="12" r="2" fill="#FFC928"/>

      <div><b>ReviewRadar</b><small>aspect sentiment lab</small></div>

    <nav id="nav"></nav>

  </aside>
  <div id="main">
    <header id="top">
      <button id="menu" class="btn ghost" aria-label="Open menu">☰</button>

      <div id="chips" role="group" aria-label="Categories"></div>
      <button id="theme" class="btn ghost" aria-label="Toggle light and dark theme">◐</button>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<div id="scrim"></div>
<div id="tip" role="tooltip"></div>
<div id="toasts" aria-live="polite"></div>
<dialog id="dlg"><form method="dialog"><p id="dlg-msg"></p><div class="row"><button value="no" class="btn ghost">Cancel</button><button value="yes" class="btn danger" id="dlg-yes">Confirm</button></div></form></dialog>

rs": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2015-08-31"}, {"id": "R1ORGBETCDW3AI", "cat": "Books", "pid": "1623953553", "title": "I Saw a Friend", "head": "Please buy \"I Saw a Friend\"! Your children will be delighted!", "body": "My wife and I ordered 2 books and gave them as presents...one to a friend's daughter and the other to our grandson! Both children were so happy with the story, by author Katrina Streza, and they were overjoyed with the absolutely adorable artwork, by artist Michele Katz, throughout the book! We highly recommend \"I Saw a Friend\" to all your little ones!!!", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2015-08-31"}, {"id": "R7TNRFQAOUTX5", "cat": "Books", "pid": "142151981X", "title": "Black Lagoon, Vol. 6", "head": "Shipped fast.", "body": "Great book just like all the others in the series.", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2015-08-31"}, {"id": "R2GANXKDIFZ6OI", "cat": "Books", "pid": "014241543X", "title": "If I Stay", "head": "Five Stars", "body": "So beautiful", "stars": 1, "hv": 0, "tv": 0, "ver": 0, "vine": 0, "label": "positive", "date": "2015-08-31"}, {"id": "R2NYB6C3R8LVN6", "cat": "Books", "pid": "1604600527", "title": "Stars 'N Strips Forever", "head": "Five Stars", "body": "Enjoyed the author's story and his quilts are incredible. I have plans to make three.", "stars": 1, "hv": 2, "tv": 2, "ver": 1, "vine": 0, "label": "positive", "date": "2015-08-31"}, {"id": "R13U5PBJI1H94K", "cat": "Books", "pid": "0399170863", "title": "The Liar", "head": "PREDICTABLE ALMOST FROM PAGE 1", "body": "Two or three pages into the book I suspected how it would end. And after another 10 or 20 pages, I was sure. And I was right. So much for suspense. The best I could say about this book is that it is okay. Just barely. It's a long book -- unnecessarily long -- and when the author hasn't taken the trouble to craft her plot in a suspenseful way, there's not a lot there to make you want to turn the page. I have mixed feelings about her main character, who was supposed to have been a vibrant, energetic, assertive woman, yet became weak and submissive to her manipulative husband. It's hard for any reader to identiify with that. Additionally, the romance in the book isn't all that interesting -- just two people who are attracted to each other. No real getting-to-know-you development, no build-up of heat, no surprise, really. This 500-page book is really 250 pages too long and it all feels stretched out, with long sequences of unnecessary dialogue, superfluous scenes to establish things that already have been established, and so on. Can't help wondering what's going on with Nora Roberts these days. She's written a number of really good books, but her recent books seem like \"Nora Roberts diluted\". So-so, at best. Maybe with so many books behind her, she's just burning out. As far as this one goes, I'm glad I got it from the library. If I had paid for it, I'd have been steamed. Maybe if she wrote fewer books each year -- but better ones -- I'd be a happier reader.", "stars": 0, "hv": 1, "tv": 1, "ver": 0, "vine": 0, "label": "negative", "date": "2015-08-31"}, {"id": "R1H8UVH990F8VE", "cat": "Books", "pid": "1517007240", "title": "Devil in the Details (Book 2: The Monastery Murders) (Volume 2)", "head": "The Monastery Murders - Book 2: Devil in the Details", "body": "\"Secrets in the Shallows,\" Book 1 of \"The Monastery Murders\" series grabbed me and drew me in! Book 2, \"Devil in the Detals\" tightened its hold on me and now I'm addicted! Did Mother Superior really murder the two Catholic school boys? If she didn't, then who did, and will the actual murderer be found out and caught? Did the murder of the beautiful, golden tressed nun and a boy's apparent suicide ten years earlier tie in with the more recent murders? What is the spirit in the Monastery trying to say? Some answers are revealed in this book, but the mystery broadens, and many more questions arise. I enjoyed this gripping book immensely and you will too! Now I must read Book 3 so I can get the whole story!", "stars": 1, "hv": 2, "tv": 2, "ver": 0, "vine": 0, "label": "positive", "date": "2015-08-31"}, {"id": "R2MC0N30WZMRQ5", "cat": "Books", "pid": "0671728725", "title": "Knowing When to Stop: A Memoir", "head": "Five Stars", "body": "I love it!", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2015-08-31"}, {"id": "R2NO2HXK16Y4J", "cat": "Books", "pid": "1111349533", "title": "The American Pageant", "head": "Five Stars", "body": "It was a great purchase.", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2015-08-31"}, {"id": "R245YIAVJK82ZL", "cat": "Books", "pid": "812211637X", "title": "Punjabi C.L. Bible / Common Language Version", "head": "Five Stars", "body": "Quality product fast shipping.", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2015-08-31"}, {"id": "RFBMLBWQOZ1UM", "cat": "Books", "pid": "0679413359", "title": "The Aeneid (Everyman's Library)", "head": "Five Stars", "body": "Very happy", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2015-08-31"}, {"id": "RHE1FEWV3KTQH", "cat": "Books", "pid": "0983990662", "title": "The YMCA of Middle Tennessee: Three Centuries of Service", "head": "Great history book by renown author.", "body": "Love reading all books by this author. Very in-depth. His love of history is evident. Always accurate. Reputable shipper.", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2015-08-31"}, {"id": "R2BB9U7PHO7ETO", "cat": "Books", "pid": "156852062X", "title": "Memoirs By Harry S. Truman: 1945 Year of Decisions", "head": "Five Stars", "body": "such a great purchase", "stars": 1, "hv": 0, "tv": 1, "ver": 1, "vine": 0, "label": "positive", "date": "2015-08-31"}, {"id": "R28XJJP754GYXO", "cat": "B e the greatest utmost respect for Nile Rogers. Anyone who wants to know the the 70's music genre, must include this in their studies.", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2015-08-31"}, {"id": "R3CGOEQ87AJ9F1", "cat": "Books", "pid": "098467120X", "title": "Estelle: An Inspiring Love Story, An Amazing Story of Persistent Love and the Prayers that Produced a Great Spiritual Awakening", "head": "Five Stars", "body": "Great book. Good value. Prompt delivery.", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2015-08-31"}, {"id": "R2Y2BFAUR31624", "cat": "Books", "pid": "0373677022", "title": "Rodeo Rescuer (Wrangler's Corner)", "head": "4,5***", "body": "Lots of great suspense, action, fear and terror in the story, that also includes a surprising conclusion. There are not many authors who can still pull a surprise at the end for me when it comes to the crime, and when it happens, I absolutely love it! This story has a perfect balance of suspense and romance. Suspense full of twists that keeps the intensity level high through the story. Seth and Tonya both have some serious issues to be dealt with. Seth's ex-girlfriend walked out on him when he was injured, leaving him with disillusion and a broken heart. Tonya, don't only have a stalker ex-boyfriend, who had been in prison for trying to kill her before, her other boyfriend had died in a bullfighting accident. So the road ahead of them wasn't easy, but the attraction they feel for each other is strong, and the connection they have go deeper than an attraction, they have respect, protectiveness, and kindness towards each other, they have lots of things in common, and they work together as a seamless team. Both of them are strong and independent, and I loved them together, it was so natural, the affection between them genuine and it was sweet how they took care of each other. Great, charming, and likable characters, loving families, romance that makes you smile, and a string of crimes and mysteries, all presented in a solid plot to entertain and touch your heart ~ Four Spoons with a teaspoon on the side", "stars": 1, "hv": 0, "tv": 0, "ver": 0, "vine": 0, "label": "positive", "date": "2015-08-31"}, {"id": "R2SVKF64DEVDKO", "cat": "Books", "pid": "0789496879", "title": "Bonsai (101 Essential Tips)", "head": "Very informative", "body": "Very informative book- so informative that I think the only Bonsai I will be admiring in my home is one bought at the flower shop- I learned that this is as much a commitment as getting a pet! I did pull up a pine sapling in my yard and will try to start a Bonsai- following the simple to under stand directions in this great little book - you will not be disappointed and you will learn that about any plant can be trained to be a bonsai-", "stars": 1, "hv": 1, "tv": 1, "ver": 1, "vine": 0, "label": "positive", "date": "2015-08-31"}, {"id": "R3CWIR7I4YIW4R", "cat": "Books", "pid": "1605740012", "title": "to Mormons, with LOVE", "head": "... general things that happen in Utah but i was disappointed in the lack of specifics and the post modern ...", "body": "The book covers some of the general things that happen in Utah but i was disappointed in the lack of specifics and the post modern view this woman has.", "stars": 0, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "negative", "date": "2015-08-31"}, {"id": "RGO3UIU3OBEYZ", "cat": "Books", "pid": "1516859146", "title": "Rising Tide (SIRENS, Book 1) (Volume 1)", "head": "I decided to give it a go myself and am so glad I did", "body": "I bought this for my teen daughter because she expressed interest in finding a book about sirens. I decided to give it a go myself and am so glad I did. I highly recommend!", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2015-08-31"}, {"id": "R2FUZZXRFMR5YC", "cat": "Books", "pid": "0062510630", "title": "Earth Medicine: Ancestor's Ways of Harmony for Many Moons", "  Credit card? Making friends at work? I'm assuming her target reader is a high school student. I have the utmost respect for Kimberly but this book is disappointing.", "stars": 0, "hv": 3, "tv": 5, "ver": 0, "vine": 0, "label": "negative", "date": "2015-08-31"}, {"id": "R3E7686UOSWVI7", "cat": "Books", "pid": "0143039989", "title": "The Haunting of Hill House (Penguin Classics)", "head": "What an underdeveloped, unoriginal waste of time", "body": "First off, I have no idea who is writing the 5 star reviews on this dreck. They are either part of the publisher's marketing department, fanboys of the author, haven't actually read it, or are sleeping with the writer. The main character starts off as an annoying, immature, self centered little bore and rides that wave all the way through the book. Most of her background story seemed irrelevant, only occupying the pages for the author to pack additional thickness into the book's spine. There was so little development of the actual house itself or analysis of any of the events by the doctor leading the research study that it was laughable. The whole story seemed so rehashed of other haunted house works that it screamed \"been there, done that.\" ***SPOILER ALERT (not that it matters; hopefully you won't waste your time anyway)*** The only enjoyable part was the main character committing suicide on the second to last page of the book. If it had happened in the first chapter, maybe it would have developed into something marginally palatable. Bottom line: If you were unfortunate enough to have bought this, cut off the spine and use it to line your rabbit's cage.", "stars": 0, "hv": 2, "tv": 12, "ver": 0, "vine": 0, "label": "negative", "date": "2015-08-31"}, {"id": "R2TRQAQL0R9QJX", "cat": "Books", "pid": "0300181051", "title": "The President and the Apprentice: Eisenhower and Nixon, 1952-1961", "head": "Three Stars", "body": "Was a gift who said it was ok", "stars": 0, "hv": 0, "tv": 14, "ver": 1, "vine": 0, "label": "negative", "date": "2015-08-31"}, {"id": "R195AO9QYAJR50", "cat": "Books", "pid": "0692380817", "title": "The Oregon Bigfoot Highway", "head": "Beware, this book incites wanderlust", "body": "Few books on this subject capture a landscape and its history so well. The friendly tone comes off as one long campfire story, but the information is packed with helpful tips on safely navigating Oregon forest roads, wilderness survival, and scouting for evidence of the elusive Sasquatch. A good source reference spanning decades of quality field work, this one deserves a permanent home in your library. The book includes informative summary tables and GPS coordinates, so the casual tourist or experienced enthusiast can join the journey. Whether you do so on Google Earth or on foot, you will learn something from the authors and those who collaborated with them over the years.", "stars": 1, "hv": 0, "tv": 0, "ver": 0, "vine": 0, "label": "positive", "date": "2015-08-31"}, {"id": "R145MGMNF5YTNN", "cat": "Books", "pid": "0578007304", "title": "The Queen of Fire and the King of Ice", "head": "I highly recommend that parents purchase this book for their children when ...", "body": "As a clinical psychologist, a mom of three, and the author of How to Talk to Your Kids About Your Divorce, I highly recommend that parents purchase this book for their children when they are separated or divorced. This story shows that divorce happens when two people are too different to make a marriage work, without blame or fault. It is told as a parable that will appeal to small kids- the queen and the king just cannot live in the same home because they are too different, although at first they didn't realize that this was the case. This is a reassuring story that focuses on the love that both parents maintain for their child despite divorcing and living separately. Five stars.", "stars": 1, "hv": 0, "tv": 0, "ver": 0, "vine": 0, "label": "positive", "date": "2015-08-31"}, {"id": "R80QKVVBQCEPW", "cat": "Books", "pid": "0992551501", "title": "Against Their Odds", "head": "Determination", "body": "As someone who knows Jaynie's journey, 'Against Their Odds' demonstrates how the right environment and determination can be a greater healer than some areas of medicine are currently capable. Jeff Edgecombe", "stars": 1, "hv": 1, "tv": 1, "ver": 0, "vine": 0, "label": "positive", "date": "2015-08-31"}, {"id": "RIZFZ2R3Y1ODK", "cat": "Books", "pid": "0761149120", "title": "Brain Quest Workbook: Kindergarten", "head": "Five Stars", "body": "This is good for my 4 year old, but not challenging enough.", "stars": 1, "hv": 0, "tv": 1, "ver": 1, "vine": 0, "label": "positive", "date": "2015-08-31"}, {"id": "R3L4F7K14HYS16", "cat": "Books", "pid": "1462114113", "title": "Daily Tortilla: Authentic Mexican Recipes", "head": "Authentic Mexican Food that will bring the family to the table.", "body": "Authentic Mexican recipes with easy directions, food preparations, and wonderful food that will bring the family to the table. I love how the chef has cross referenced recipes throughout the book, gave serving suggestions, and specified how to use alternate ingredients to vary the kick. A picture is worth a thousand words and you know how the recipe is supposed to look when it is done. Well done Ricardo, you knocked it out of the ball park with this one.", "stars": 1, "hv": 0, "tv": 0, "ver": 0, "vine": 0, "label": "positive", "date": "2015-08-31"}, {"id": "RMAXUR6KX8PZ5", "cat": "Books", "pid": "1502395223", "title": "Beginning Android Development: Create Your Own Android Apps Today", "head": "Three Stars", "body": "Some really strange editorial issues in the first few pages make you wonder if the publisher read it.", "stars": 0, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "negative", "date": "2015-08-31"}, {"id": "R2T4SJM0EYKQPM", "cat": "Books", "pid": "1463739311", "title": "Swarm Traps and Bait Hives: The easy way to get bees for free.", "head": "he has some great info on beekeeping", v": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2015-08-31"}, {"id": "R1X16L5GEK5XG7", "cat": "Books", "pid": "1943279926", "title": "A Long Road Home", "head": "... a thought-provoking debut novel from an artist who created beautifully flawed, believable characters", "body": "A Long Road Home is a thought-provoking debut novel from an artist who created beautifully flawed, believable characters.", "stars": 1, "hv": 1, "tv": 1, "ver": 0, "vine": 0, "label": "positive", "date": "2015-08-31"}, {"id": "R3M51HANH1A2UN", "cat": "Books", "pid": "1608236358", "title": "Daily Reading Comprehension, Grade 4", "head": "Five Stars", "body": "I was pleased with the product.", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2015-08-31"}, {"id": "R1N8B6IJ1F1W09", "cat": "Books", "pid": "1451194374", "title": "Clinical Anesthesia Fundamentals: Print + Ebook with Multimedia", "head": "Excellent lecture videos!", "body": "Many folks commented on the TEXT of the book. As a medical student, I concur with the other reviews that this is an excellent introductory resource to obtain foundation for your clinical education. This review will instead focus on the lecture videos, which supplement each and every chapter, and can be easily overlooked - and let me tell you, they are great! As someone with experience in designing and producing interactive educational multimedia, here are my takes on the videos: - There is a video lecture that supplements each chapter. They are very nice summaries and place emphasis on the important points in the text while supplementing with interesting points to enhance memorization - There are multiple choice questions immbedded between sections of each lecture, which are great reminders and pointers of key learning points and forced you to think again. Each question comes with a full explanation of choices and main concept. - The videos are short and sweet - They have very similar content to the text, but uses different sensory modalities (i.e. graphs, animations, images, audio) that enhance memorization; for example, for the introductory lecture on the history of anesthesia, the pictures of different historic figures and instruments really helped me link names to events. - As someone with experience in designing and producing educational multimedia projects, I understand how hard it is to have high quality (and actually very useful) digital contents made available to supplement the text. There are inherent restrictions on the different technical parameters allowed by such web contents, such as the definitions and smoothness of the videos. With that in mind, the qualities of the lecture videos are pretty great. The other thing is, while you can switch the slides and lecturer windows, it might be helpful to have an option to change the sizes of different windows (I personally think the lecturer's window is too small). - I could recommend several good ways to utilize the lecture videos. 1. you can watch the videos after reading the text 2. you can watch the video first, and then you can pause and refer back to the text for clarification if needed - the videos cover the main points. 3. read the text of every chapter, then when reviewing the concepts at the end of your study, use the lecture videos. In summary, great videos! And if you bought this book or planning on getting this book (yes you will like it if you are a medical student learning anesthesia or a resident looking to lay down good foundational knowledge), make sure you USE these wonderful interactive digital contents!", "stars": 1, "hv": 5, "tv": 5, "ver": 0, "vine": 0, "label": "positive", "date": "2015-08-31"}, {"id": "R2QJ8B10JAZK0G", "cat": "Books", "pid": "0894020218", "title": "USAAF Medium Bomber Units ETO and MTO, 1942-45", "head": "Wonderful american bombers", "body": "It is the last book of my collection of the the AIRCAM/ AIRWAR serie ! now, I have the 24 items. This book of 48 pages is full of pictures and beautitful drawings and Thanks a lot to Amazon and its dealers ! Kind regard.", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2015-08-31"}, {"id": "R2S1L3E4QI9XW8", "cat": "Books", "pid": "1878087355", "title": "Build Your Own Metal Working Shop From Scrap (Complete 7 Book Series)", "head": "Highly recommend.", "body": "Is getting me off to a good start.", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2015-08-31"}, {"id": "R11HGM3D5YCTUJ", "cat": "Books", "pid": "0991283201", "title": "Transformed", "head": "Five Stars", "body": "Very enjoyable read with unique story line and characters.", "stars": 1, "hv": 0, "tv": 0, "ver": 0, "vine": 0, "label": "positive", "date": "2015-08-31"}, {"id": "R2DN7XAKU0IUGN", "cat": "Books", "pid": "1574219723", "title": "Creative Coloring Inspirations: Art Activity Pages to Relax and Enjoy!", "head": "Perfect", "body": "This coloring book is beautiful. The pages are single page and perforated. I love it!", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2015-08-31"}, {"id": "R75UBFX038TQF", "cat": "Books", "pid": "1907056602", "title": "The Mind (Salmon Poetry)", "head": "One of the finest voices in poetry you might not have heard about yet.", "body": "If I were still working with John FitzGerald (in the interest of full disclosure, we worked together at Red Hen Press), I would nudge him and say of his book THE MIND, \"Skynet becomes self-aware at 2:14 a.m. Eastern time, August 29th.\" My sense of John is that he has been aware of himself for a long time, but not in a solipsistic or narcissistic way at all. He is a keen observer, a consumer of origins, fine distinctions, continua, grand schemes, and minute details. He likely began observing and contemplating information from the moment he experienced the glare of light in the delivery room, and he has never stopped. Interestingly, while THE MIND is about the remarkable way John thinks, it speaks to the larger questions of how we all think, how we came to be sapient in the first place, and how we develop as thinking souls in space and time. Keeping the language of his prose-like tercets basic, unadorned, and free-flowing, he accomplishes poetry of significance and elemental beauty. Left brain contemplation of structure and systems aligns itself with right brain wonder and whimsy, but neither hemisphere dominates in the work, so the reader can only expect the unexpected. And the rewards are great: poems of curiosity, orientation with the universe, sorrow, finding center, and surprising hilarity. (Only John can make the idea of rocks funny.) If I were teaching from John's book, I would encourage poetry students to examine his masterful skill with personification. I would encourage philosophy students to wrestle with his experiences of phenomena. I would ask psychology and neuro-biology candidates to experience the brain from inside-out. I would ask physics students to explore how we process space and time in an era when such concepts are continually challenged and updated. I would ask divinity students to consider creation from the point of view of the created. THE MIND weighs so many approaches to thinking and being that you won't devour it in one or two sittings. Read it as you would the Book of Genesis, or Hawking, or an introduction to meditation. You will not think the same way ever again after reading it.", "stars": 1, "hv": 1, "tv": 1, "ver": 0, "vine": 0, "label": "positive", "date": "2015-08-31"}, {"id": "RO1LRF7WXOVDE", "cat": "Books", "pid": "080240992X", "title": "Helping Without Hurting in Short-Term Missions: Participant's Guide", "head": "Five Stars", "body": "A must read for all those planning short term missions!", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2015-08-31"}, {"id": "R1B7LBKKU7CH9R", "cat": "Books", "pid": "146542900X", "title": "My First ABC (My First Books)", "head": "Exce 08-31"}, {"id": "R2N3K8FK4UI2IO", "cat": "Books", "pid": "1509203141", "title": "Return to Me", "head": "and their hearts loved deeply while continuously breaking", "body": "You'll find yourself transported back to war-time forties...a time when people lived in limbo, when every moment could be the last, and their hearts loved deeply while continuously breaking. The characters are complex and believable, and the story sweeps you into their lives. Multiple plotlines, from multiple eras, intertwine around the theme of \"return.\" Sadie is forced to examine her beliefs as her world shakes over and over again, and the journey through hard times makes one wonder if love really is enough. In the end, the reader is left examining his / her own beliefs around that very question.", "stars": 1, "hv": 3, "tv": 3, "ver": 0, "vine": 0, "label": "positive", "date": "2015-08-31"}, {"id": "R34OETSC748FNA", "cat": "Books", "pid": "0689120079", "title": "Fatal Voyage: The Sinking of the Uss Indianapolis", "head": "Story that has been too long covered up. Shows ...", "body": "Story that has been too long covered up. Shows the true side of the top echelon of American service people and their utter regard for those who really do the work!", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2015-08-31"}, {"id": "R3DP1CYB1M7V26", "cat": "Books", "pid": "0990454665", "title": "The Gender of Inanimate Objects and Other Stories", "head": "I loved this book", "body": "I loved this book! Maya is such an interesting character and Marello does an amazing job of bringing Sweetwater County and all of its complex inhabitants to life. I think \"In One Enormous Bed like Children\" is also amazing.", "stars": 1, "hv": 1, "tv": 1, "ver": 1, "vine": 0, "label": "positive", "date": "2015-08-31"}, {"id": "RGYFDX8QXKEIR", "cat": "eBooks", "pid": "B007KO2MLO", "title": "Big Maria", "head": "Quirky", "body": "Elmore Leonard meets the cast of Sierra Madre. Just a quirky read tha ry was a bit like watching a tennis match. They bounced like a tennis ball back and forth from his side of the court to her side of the court. They were together then not together, together and then not, over and over again. Like a tennis match, it was entertaining at times, but was nerve racking and tiring to watch. Yet, I couldn't stop reading. Although it was painful to witness, I did like the dilemma Callum found himself in when the woman who had shattered his heart suddenly came back to him and wanted him back. He was caught between that proverbial rock and a hard place and was forced to make an impossibly tough choice. But, just like in a tennis match, in order for Callum to win in Love, he had to put himself out there, face his opponent head on with everything he had, and fight to win. I get why Stella's brother did what he did. He gave his \\\\\"brother\\\\\" and sister the ultimate gift.....LOVE and family!", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2013-09-09"}, {"id": "R3R5DILCWM8J7B", "cat": "eBooks", "pid": "B00E4W4984", "title": "Forgetting Tabitha", "head": "It was a wonderful book", "body": "I really enjoyed this book. It broke my heart to imagine what some of the children had to do to survive. The book kept my interest throughout the entire book. I recommended my sister and her daughter both to read this book. I loved it.", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2013-09-09"}, {"id": "RR5K72IZOCOFE", "cat": "eBooks", "pid": "B005A1JBB8", "title": "The Blacksmith's Son (Mageborn Book 1)", "head": "Worth reading", "body": "Although not completely original, it has a decent plot and entertaining points. Some humor it's well, but at times is a bit cheesy. Still worth reading though.", "stars": 1, "hv": 0, "tv": 0, "ver": 0, "vine": 0, "label": "positive", "date": "2013-09-09"}, {"id": "R3K9PJU5GLDY3O", "cat": "eBooks", "pid": "B0044DELIQ", "title": "Vampire Vacation: Adult Urban Fantasy (The V V Inn Book 1)", "head": "Very Good Romp", "body": "Enjoyed the characters and the story line. Kept me entertained and ready for more. A nice fantasy of the undead.", "stars": 1, "hv": 1, "tv": 2, "ver": 1, "vine": 0, "label": "positive", "date": "2013-09-09"}, {"id": "R1KTZMCDOJXAEK", "cat": "eBooks", "pid": "B00DJQYATE", "title": "By the Tail (Cougar Falls Book 7)", "head": "Love this Series", "body": "I love the Cougar Falls Series, each time a new one comes out I have new favorite. This was Quince and Joy's Story. Quince took over the Pride after it had been corrupted by Lex. Quince was strong, loyal, charming, determined. He was determined to mate with Joy, he knew they were mates. Joy just kept avoiding him. The chemistry between them was through the roof. I laughed out loud numerous times at his tactics in getting Joy's attention. Joy was strong-willed, funny, determined, and didn't take anything off anybody. Joy and Quince had to work out their issues while dealing with some of Lex' s followers that wanted to cause trouble. By the Tail was funny, heartwarming, hot and steamy with added action. This was a great book, just like the rest of the Courgar Falls Series. I highly recommend. I received an ARC copy of this book in exchange for a honest review. All opinions and thoughts are my own.My review can be found at [...]", "stars": 1, "hv": 0, "tv": 0, "ver": 0, "vine": 0, "label": "positive", "date": "2013-09-09"}, {"id": "R3SBEH4Y3W9W11", "cat": "eBooks", "pid": "B004XFYNNS", "title": "The Kingdom (A Fargo Adventure Book 3)", "head": "Love this author", "body": "I really enjoy Clive Cusslers work. The Fargos are a new team. I am going to read a lot more of his books.", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2013-09-09"}, {"id": "R3GB8WOHSWW2EG", "cat": "eBooks", "pid": "B00A27Z6GO", "title": "6 Erotic Bedtime Stories (Adult, Sexual content)", "head": "Didn't finish...", "body": "I have to admit I didn't finish. The first story was just so-so and I stopped when continuity was lost in the second story when both her husband's and her co-worker's name changed and then back again. Its a super short story and the writer isn't skilled enough to make sure the names are constant? Is it Todd or Perry? Ron or Robert? At this point, I just didn't care enough to continue. I didn't know what to rate it, so gave it middle of the road.", "stars": 0, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "negative", "date": "2013-09-09"}, {"id": "RDM68WMOEDNRJ", "cat": "eBooks", "pid": "B008EGV4BQ", "title": "The Purpose Driven Life: What on Earth Am I Here For?", "head": "Can't unread it now!", "body": "Thanx paster Rick You served us all with the word and hart of God! Amazing read! Kind regard and love in Christ", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2013-09-09"}, {"id": "R3TW70YF2WZK9O", "cat": "eBooks", "pid": "B00655U3WE", "title": "Insurgent (Divergent Trilogy, Book 2)", "head": "Great second installment", "body": "As with divergent the second book in the series is great. The characters are well written and you never know what tris will do next. I can't wait for the next book!", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2013-09-09"}, {"id": "R39ESX43X1SA5T", "cat": "eBooks", "pid": "B006NG0GXQ", "title": "Forever His: A Time-Travel Romance (Stolen Brides Series Book 1)", "head": "Completely absurd", "body": "From the time that Celine travels back until the end she becomes a loathsome character. She is weak and written to be quite pathetic. How she can so quickly fall in love with a cruel man (and he is cruel and rude until about 3/4 of the way through) is beyond me. I was rooting for the villain to do away with them both. I read some of the dialogue between the two love interests to my husband and we laughed at its absurdity. The writing style was very good but the plot and characters were not en IA man versus a ruthless weapons dealer. Instead, it was mostly a sappy love story with a thin layer of action as a flavorless topping. I may give Morrell another chance. It was written well enoughto make it tolerable, but I really hope the next book I read of his is exceptionally better. I recommend this book to those who want to read about flawlessly beautiful women with tepid intelligence, and hard headed ex military men who try too hard to be touchy feely on the inside. The romance was almost as bland as the mildly entertaining action. Read this if you have only two choices between this or Ender´s Game. That book was infinitely worse.", "stars": 0, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "negative", "date": "2013-09-09"}, {"id": "R1OIZTGCOJEH4X", "cat": "eBooks", "pid": "B008J6RN0C", "title": "Worse Than Being Alone", "head": "Slow start", "body": "I wasn't too thrilled when i started, but I finished the books pretty quickly because it kept me intrigued. Sad about the way it ended though.", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2013-09-09"}, {"id": "R3A6UL5PDP3BL1", "cat": "eBooks", "pid": "B00D7Z4GQY", "title": "The Husband's Secret", "head": "Loved it", "body": "So many real life stories and tragedies. It was interesting to read what the characters were thinking and feeling about their life choices. Very perceptive author.", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2013-09-09"}, {"id": "RLGQIOAG29R6R", "cat": "eBooks", "pid": "B00BISX7NK", "title": "Becoming a Great Godparent: Everything a Catholic Needs to Know", "head": "Doesn't really say how to be 'great' - just the basics", "body": "i was hoping for a bit more than what this book had to offer. there weren't enough practical ideas in here or anything really original. I had read alot of this on the internet and a whole chapter was just already well known Catholic prayers. The gift ideas were ok but predictable. The book was not really worth the price tag. disappointing and a missed opportunity since there's not many books on being a godparent and this could have filled the gap.", "stars": 0, "hv": 0, "tv": 0, "ver": 0, "vine": 0, "label": "negative", "date": "2013-09-09"}, {"id": "RLJ1PC5SRFXHT", "cat": "eBooks", "pid": "B008J48RA4", "title": "The Storyteller", "head": "Wow what a story", "body": "This is a very emotional story, in fact I had to put it down several times because I would find myself actually angry from reading it. I loved t.", "stars": 1, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "positive", "date": "2013-09-09"}, {"id": "R1FDGOW2MZ66QZ", "cat": "eBooks", "pid": "B007R731MS", "title": "Firefly Beach", "head": "Walking a Mile in Someone Else's Shoes", "body": "My father used to tell me that it was necessary \"to walk a mile in someone else's shoes in order to understand them.\" The story line of this book does a good job of delving into the circumstances that shape the lives and actions of the people depicted in the story. It is very interesting.The supernatural intuition of the main character is well thought out, especially as it relates to her own life as she remembers the problems of growing up. The book is not quite what I expected, but thought provoking nonetheless. There were turns in the story where I knew where it was going, but also some unexpected detours that were charming.", "stars": 0, "hv": 0, "tv": 0, "ver": 1, "vine": 0, "label": "negative", "date": "2013-09-09"}, {"id": "R34VH1AP8P16XN", "cat": "eBooks", "pid": "B00BCFYN50", "title": "The Highway: A Novel (Cody Hoyt Book 2)", "head": "Well written book, but not my kind of story.", "body": "The Cody Hoyt character was killed off in the opening scenes of the book. ( I haven't finished the book yet. This is not the typical CJB venue and so I have been slow in finishing the book.) This is a little too gruesome for my tastes. I guess I am too old for this sort of story.", "stars": 0, "hv": 3, "tv
